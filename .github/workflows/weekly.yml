name: Haftalık haber taraması

on:
  schedule:
    - cron: "30 5 * * 1"   # her pazartesi 08:30 TSİ (etkinlik taramasından önce)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Taramayı çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OZET_MODEL: ${{ vars.OZET_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m radar.run
      - name: Sonuçları commit'le
        run: |
          git config user.name "haber-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ output/ docs/
          git diff --staged --quiet || git commit -m "Haftalık tarama: $(date +%Y-%m-%d)"
          git push
