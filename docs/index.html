5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "bankingsupervision.europa.eu", "published": "2026-10-01", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "6684290eabeed76f", "title": "Apple changes full-disk access permissions to curb abuse from AI agents", "url": "https://arstechnica.com/security/2026/10/apple-changes-full-disk-access-permissions-to-curb-abuse-from-ai-agents/", "category": "yapay-zeka", "source": "arstechnica", "site": null, "published": "2026-10-02", "first_seen": "2026-10-05", "relevance": 6, "baslik_tr": "Apple, yapay zeka ajanlarının kötüye kullanımına karşı tam disk erişimi izinlerini değiştiriyor", "ozet": "Apple, üçüncü taraf uygulama geliştiricilerinin macOS gizlilik ayarlarını kötüye kullanarak mesaj geçmişlerine erişmesini önlemek amacıyla bu ayarlarda değişikliğe gideceğini duyurdu. Karar, Meta'nın yapay zeka ajanı Muse'un bir kullanıcının Apple Messages yazışmalarına izinsiz eriştiği iddialarının ardından geldi. Gelişme, geniş sistem izinlerine sahip yapay zeka asistanlarının veri gizliliği açısından oluşturduğu riskleri gündeme taşıması bakımından önem taşıyor.", "haber_metni": "Apple, üçüncü taraf uygulama geliştiricilerinin mesaj geçmişlerine erişmek amacıyla macOS gizlilik ayarlarını kötüye kullanmasını engellemek için bu ayarlarda değişiklik yapacağını açıkladı. Cuma günü yapılan duyuru, teknoloji yazarı Jason Aten'in iki hafta önce dile getirdiği bir iddianın ardından geldi. Aten, Meta'nın genel amaçlı yapay zeka ajanı Muse'un, kendisi ile bir iş arkadaşı arasındaki Apple Messages yazışmasına atıfta bulunan talep edilmemiş bir bildirim gönderdiğini, Muse'a mesajlarını okuma izni hiç vermediğini belirtmişti. Olay sosyal medyada geniş yankı buldu; birçok kullanıcı, takvim, e-posta, mesaj ve alışveriş hesaplarına erişim verilen yapay zeka asistanlarının dikkatli kullanılmadığında ciddi zararlara yol açabilecek güçlü araçlara benzediği görüşünü paylaştı.\n\nMeta Teknoloji Direktörü David Singleton, iddialara yanıt olarak Muse'un Apple Messages'a erişebilmesi için kullanıcının iki izni manuel olarak vermesi gerektiğini söyledi: macOS sistem düzeyinde tam disk erişimi ve Muse içindeki Messages bağlayıcı ayarının etkinleştirilmesi. Singleton, Muse Mac uygulamasındaki Messages entegrasyonunun kullanıcı onayına bağlı olduğunu ve her iki ayar etkinleştirilmeden mesaj içeriğinin okunamayacağını vurguladı. Ancak macOS güvenlik uzmanı Patrick Wardle bu açıklamayı sorguladı; Wardle'a göre tam disk erişimi verildiğinde, tarayıcı geçmişi, çerezler ve sohbetler dahil root olmayan tüm dosyalar teknik olarak okunabilir durumda. Meta, uygulamanın tam disk erişimine rağmen mesajları nasıl okuyamadığına ilişkin soruya yalnızca Singleton'ın önceki açıklamasını yineleyerek yanıt verdi.", "ozet_durum": "tam"}, {"id": "5e23e9bc60ee479d", "title": "European Central Bank (ECB) Considers Direct Issuance, Bridges, Private Tokens for On-Chain Reserves", "url": "https://www.crowdfundinsider.com/2026/10/315256-european-central-bank-ecb-considers-direct-issuance-bridges-private-tokens-for-on-chain-reserves/", "category": "merkez-bankaciligi", "source": "crowdfundinsider", "site": null, "published": "2026-10-05", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "hata"}, {"id": "363b48d5e619fffe", "title": "How much should you authorise your AI agent to do?", "url": "https://blogs.lse.ac.uk/businessreview/2026/10/01/how-much-should-you-authorise-your-ai-agent-to-do/", "category": "ai-governance", "source": "lse-business", "site": null, "published": "2026-10-01", "first_seen": "2026-10-05", "relevance": 7, "ozet_durum": "hata"}, {"id": "0cd6200a84637962", "title": "What happens now that Trump and Xi failed to write new AI rules?", "url": "https://blogs.lse.ac.uk/businessreview/2026/09/29/what-happens-now-that-trump-and-xi-failed-to-write-new-ai-rules/", "category": "ai-governance", "source": "lse-business", "site": null, "published": "2026-09-29", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "hata"}, {"id": "f001209a87db630d", "title": "Giving artificial intelligence the power to pay", "url": "https://www.omfif.org/2026/10/giving-artificial-intelligence-the-power-to-pay/", "category": "merkez-bankaciligi", "source": "omfif", "site": null, "published": "2026-10-01", "first_seen": "2026-10-05", "relevance": 7, "baslik_tr": "OMFIF, yapay zeka ajanlarının ödeme yetkisi kazanmasını yeni sayısında ele aldı", "ozet": "OMFIF'in Digital Monetary Institute Journal dergisinin yeni sayısı, yapay zeka ajanlarının insan gözetimi olmadan ödeme yapabilmesi için gereken koşulları ve bunun doğuracağı riskleri inceliyor. Circle, Barclays, IMF ve Coinbase gibi kurumlardan uzmanlar, hesap verebilirlik, denetim ve yasal kesinlik konularını merkez bankaları ve düzenleyiciler açısından kritik başlıklar olarak öne çıkarıyor.", "haber_metni": "OMFIF'in Digital Monetary Institute Journal dergisinin yeni sayısı, yapay zeka ajanlarının ödemeler alanındaki rolünü sektör uzmanlarının katkılarıyla değerlendiriyor. Hâlihazırda birçok ülkede ürün karşılaştırma ve satın alma tavsiyesi veren ajanların, kullanıcı gözetimi olmadan ödeme tamamlayabilir hâle gelmesi doğal ancak zorlu bir sonraki adım olarak nitelendiriliyor. Circle'dan David Anderson, ekonominin birçok unsurunun hazır olduğunu ancak 'hâlâ kritik eksik parçalar' bulunduğunu belirtiyor. Minsait'ten Lara Calvo Lourido, bu tür ödemelerin benimsenmesinin güçlü kontroller, yasal kesinlik ve net hesap verebilirliğe bağlı olduğunu vurguluyor. Barclays'ten Gillean Dooney ise gelişmenin yeni ödeme altyapılarından çok, finansal kararların yapay zekaya kademeli devri anlamına geldiğine dikkat çekiyor.\n\nDergide risk boyutu da geniş yer tutuyor. Biagio Bossone, ajanların çalışma hızı ve ödemelerin anlık niteliğinin denetim organları için büyük bir zorluk oluşturduğunu belirtiyor. Agio Ratings'ten Ben Miller ve Thanos Alevizos, aynı temel modeli kullanan ajanların aynı bilgiye eşzamanlı t ZWTWdBSlo5RmtOdkg1NHhpdl90V3VEMllKMWEwWUNIcENQUHlmUUg4MGhZeFBkaS1nYlRxNGpHRkdFSzJSUjdNMDVlLUduT2hZQXFoZ1l2NDk0cXhRYXpDRXkzSi02MTZVMHRVTkdGdw?oc=5", "category": "is-surekliligi", "source": "gnews-kesif-en", "site": "Mayer Brown", "published": "2026-09-29", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "438e919069d56b07", "title": "Supervisory risk appetite, efficiency and effectiveness - European Central Bank", "url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxQSUhRNXdUMXp5TmlIUk9JajFOS3FuMGFRUExEQjNpODZnWUNKT2ktX3Z2UTJWR3JUQ2NzRlpaX2V3VnkydksyQW81dXFhTlRmMEViTTJwYU5MLWJleW1xNzBPb0l1blpoNUYySV9sSmFNS21ISXA1azlDU0NydXcxZXJpWU5FallkMUE?oc=5", "category": "is-surekliligi", "source": "gnews-kesif-en", "site": "European Central Bank", "published": "2026-09-30", "first_seen": "2026-10-05", "relevance": 7, "ozet_durum": "içerik alınamadı"}, {"id": "5757eadbacf2d4df", "title": "Eurosystem brings central bank money to tokenised finance", "url": "https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260921~e754847a7b.en.html", "category": "merkez-bankaciligi", "source": "ecb-press", "site": null, "published": "2026-09-21", "first_seen": "2026-09-28", "relevance": 6, "baslik_tr": "Eurosystem, tokenize varlık işlemlerini merkez bankası parasıyla mutabakata bağlayan Pontes'i başlattı", "ozet": "Eurosystem, toptan tokenize varlık işlemlerinin merkez bankası parasıyla mutabakata bağlanmasını sağlayan Pontes çözümünü 21 Eylül 2026'da devreye aldı. Girişim, Eurosystem'in tokenize finansa yönelik stratejik programının ilk adımı olup tam uygulamanın 2028'e kadar tamamlanması bekleniyor.", "haber_metni": "Eurosystem, toptan tokenize varlık işlemlerinin merkez bankası parasıyla mutabakata bağlanmasına imkân tanıyan Pontes çözümünü 21 Eylül 2026 tarihinde kullanıma sundu. Pontes, merkez bankası parasını tokenize bir geleceğe uygun hale getirmeyi ve hızla gelişen bu finansal ekosistemin gelişimini desteklemeyi amaçlayan stratejik programın ilk girişimi olarak konumlandırılıyor. Çözüm, Eurosystem'in 2024 yılında dağıtık defter teknolojisi (DLT) kullanılarak yürüttüğü mutabakat testlerinin sonuçları üzerine inşa edildi; söz konusu testlerde kamu ve özel sektör paydaşları, teknolojinin yaygınlaşması için risksiz bir mutabakat varlığına erişimin kritik olduğunu belirtmişti. ECB Başkanı Christine Lagarde, dijital çağda daha entegre, yenilikçi ve dirençli bir Avrupa finansal piyasası için piyasayla yakın iş birliği içinde ilerlemeye devam edeceklerini ifade etti.\n\nPontes başlangıçta temel bir hizmet seti sunacak; gelişmiş özellikler ve daha uzun çalışma saatleri kademeli olarak devreye alınacak ve tam uygulamanın 2028'e kadar tamamlanması bekleniyor. Aralarında Deutsche Bank, Santander, Société Générale, Avrupa Yatırım Bankası ve KfW'nin bulunduğu ilk piyasa katılımcıları grubu ile Axiology, Cashlink, Clearstream ve SWIAT gibi DLT operatörleri katılım sürecini tamamladı; Deutsche Bundesbank da piyasa katılımcısı sıfatıyla sisteme dahil oldu. ECB Yönetim Kurulu üyesi Piero Cipollone, Pontes'in merkez bankası parasının istikrar ve güvenini Avrupa tokenize finans ekosistemine taşıdığını belirtti. DLT tabanlı finansal hizmetler için entegre bir ekosistem geliştirme çalışmaları ise Appia girişimi kapsamında, 2028'e kadar bir yol haritası sunma hedefiyle Danmarks Nationalbank ve paydaşların katılımıyla sürdürülüyor.", "ozet_durum": "tam"}, {"id": "a9b00dd767fab972", "title": "Christine Lagarde: A new age of capital: growth, sovereignty and AI", "url": "https://www.ecb.europa.eu//press/key/date/2026/html/ecb.sp260914_2~a3f0efbee4.en.html", "category": "merkez-bankaciligi", "source": "ecb-press", "site": null, "published": "2026-09-14", "first_seen": "2026-09-28", "relevance": 7, "ozet_durum": "hata"}, {"id": "c29173c96e4934b0", "title": "Singapore to train 80,000 FS sector employees in AI skills", "url": "https://www.finextra.com/newsarticle/48482/singapore-to-train-80000-fs-sector-employees-in-ai-skills?utm_medium=rssfinextra&utm_source=finextrafeed", "category": "merkez-bankaciligi", "source": "finextra", "site": null, "published": "2026-09-28", "first_seen": "2026-09-28", "relevance": 7, "ozet_durum": "içerik alınamadı"}, {"id": "f937c52e82d5caa3", "title": "AI Access Becomes New Commodity for Cybercriminals", "url": "https://www.pymnts.com/cybersecurity/2026/ai-access-becomes-new-commodity-for-cybercriminals/", "category": "merkez-bankaciligi", "source": "pymnts", "site": null, "published": "2026-09-28", "first_seen": "2026-09-28", "relevance": 6, "baslik_tr": "Yapay zeka modellerine yasa dışı erişim siber suçlular için ticari meta haline geldi", "ozet": "Financial Times'ın haberine göre, yapay zeka modellerine yasa dışı erişim siber suç ekosisteminde önemli bir ticari meta haline geldi. Google Threat Intelligence Group, çalınan giriş bilgilerinin satışını ve bilişim kaynaklarının çalınmasını kapsayan 'LLM-jacking' vakalarında bu yıl belirgin bir artış gözlemlediğini bildirdi. Karanlık ağ pazarlarında Anthropic, OpenAI ve Google gibi şirketlerin modellerine erişim yüzde 97'ye varan indirimlerle satılıyor.", "haber_metni": "Financial Times'ın 27 Eylül tarihli haberine göre, yapay zeka modellerine yasa dışı erişim siber suçlular için temel bir ticari meta haline geldi. Google Threat Intelligence Group Baş Analisti John Hultquist, şirketin bu yıl 'LLM-jacking' olarak adlandırılan vakalarda ciddi bir artış gözlemlediğini belirtti. Bu vakalar arasında halka açık yapay zeka araçlarına ait çalınmış giriş bilgilerinin satışı ve kendi modellerini ücretsiz çalıştırmak isteyen grupların bilişim kaynaklarını çalması yer alıyor. Google Threat araştırmacılarının verilerine göre karanlık ağ pazarlarında Anthropic, OpenAI ve Google gibi şirketlerin modellerine erişim yüzde 97'ye varan indirimlerle satılıyor; oysa OpenAI'ın ChatGPT ve Anthropic'in Claude modellerinin en gelişmiş sürümlerine yönelik abonelikler kullanıcı başına aylık 200 dolara kadar çıkabiliyor. Hultquist, pahalı yapay zekaya düşük maliyetli erişimin saldırganlara, aynı araçlarla savunma yapmak zorunda olan hedefleri karşısında ekonomik ve verimlilik avantajı sağladığı uyarısında bulundu.\n\nHultquist, yapay zekanın artık her tehdit aktörü tarafından kullanıldığını ve bu araçların siber güvenliğin geleceğinde merkezi bir rol oynaması gerektiğini vurguladı. Yapay zekayı geçici bir eğilim olarak gören kurumların gelecekte daha fazla olay, uyarı ve saldırıyla karşılaşacağını ifade etti. PYMNTS Intelligence araştırmasına göre şirketlerin yüzde 42'si katmanlı savunma yapısı içinde üç veya daha fazla yapay zeka tabanlı savunma aracı kullanıyor; ankete katılan şirketlerin yüzde 50'si ise yapay zeka ile üretilmiş tedarikçi taklidi e-postaları en büyük tehdit olarak gösteriyor. Finans yöneticilerinin yaklaşık yüzde 90'ı tedarikçi doğrulamayı orta veya büyük ölçekli bir yük olarak nitelendiriyor.", "ozet_durum": "tam"}, {"id": "6a21e84b3f2e23d3", "title": "Creotech Quantum Prepares QKD System for Commercialization", "url": "https://thequantuminsider.com/2026/09/25/creotech-quantum-qkd-system-commercialization/", "category": "kuantum", "source": "quantuminsider", "site": null, "published": "2026-09-25", "first_seen": "2026-09-28", "relevance": 6, "baslik_tr": "Avrupa Komisyonu Creotech Quantum'un eCAUSIS Projesini Onayladı, QKD Sistemi Ticarileşiyor", "ozet": "Avrupa Komisyonu, Varşova Borsası'nda işlem gören Creotech Quantum'un yürüttüğü eCAUSIS kuantum anahtar dağıtımı (QKD) projesinin teknik ve mali sonuçlarını olumlu değerlendirdi. Şirket, geliştirdiği QKD sistemini 2026 yılında pazara sunmayı planlıyor. Proje, Avrupa'nın güvenli kuantum iletişimi alanındaki üretim kapasitesi ve tedarik zinciri hedefleri açısından önem taşıyor.", "haber_metni": "Avrupa Komisyonu, kuantum teknolojileri geliştiren ve Varşova Borsası'nda işlem gören Creotech Quantum S.A. tarafından yürütülen eCAUSIS projesinin sonuçlarını hem teknik hem de mali açıdan olumlu değerlendirdi. Horizon Europe programı ve EuroQCI girişimi kapsamında yürütülen proje, birlikte çalışabilir bir DV-QKD modülü ile kriptografik anahtar yönetim yazılımı (KMS) geliştirmeyi ve teknolojiyi sertifikasyon, entegrasyon ve seri üretime hazırlamayı amaçladı. Proje, koordinatör Creotech Instruments S.A., Avusturya Teknoloji Enstitüsü (AIT) ve Fraunhofer'dan oluşan bir konsorsiyum tarafından yürütüldü; toplam bütçe yaklaşık 6,96 milyon avro, azami finansman ise yaklaşık 4,52 milyon avro olarak gerçekleşti. Şirketten ayrılarak kurulan Creotech Quantum, projeye ilişkin tüm hak ve yükümlülükleri, fikri mülkiyet hakları dahil olmak üzere devraldı.\n\nProje kapsamında PCIe form faktörlü bir modül kullanan özgün bir QKD sistemi geliştirilip doğrulandı; sistem, Common Criteria gereklilikleri gözetilerek ve yerleşik BB84 protokolü temel alınarak tasarlandı. Gelecekteki sertifikasyon sürecini destekleyecek dokümantasyon ile diğer QKD altyapı bileşenleriyle birlikte çalışabilirliği sağlayacak çözümler de hazırlandı. Creotech Quantum, QKD çözümünü 2026 yılında pazara sunmayı planlıyor; proje, yılda 1.000 modüle kadar üretim kapasitesi hedefliyor ve bu kapasitenin 10.000 modüle çıkarılması potansiyeli bulunuyor. Şirket CEO'su Anna Kamińska, Komisyonun olumlu değerlendirmesinin çözümlerinin teknolojik olgunluğunu teyit ettiğini ve güvenli kuantum iletişiminde Avrupa'nın yetkinlik ve üretim kapasitesinin geliştirilmesi açısından önemli bir adım olduğunu belirtti.", "ozet_durum": "tam"}, {"id": "ed7f0d936c9367a6", "title": "Guest Post: Quantum Investment May Start With Post-Quantum Security", "url": "https://thequantuminsider.com/2026/09/25/quantum-investment-post-quantum-security/", "category": "kuantum", "source": "quantuminsider", "site": null, "published": "2026-09-25", "first_seen": "2026-09-28", "relevance": 7, "ozet_durum": "hata"}, {"id": "a974ab2ce2558d70", "title": "Bank of America plans to double AI budget next year", "url": "https://www.ciodive.com/news/bank-of-america-ai-spending-roi-headcount-moynihan/831189/", "category": "genel-bt", "source": "ciodive", "site": null, "published": "2026-09-24", "first_seen": "2026-09-28", "relevance": 6, "baslik_tr": "Bank of America, yapay zeka harcama bütçesini gelecek yıl ikiye katlamayı planlıyor", "ozet": "Bank of America CEO'su Brian Moynihan, bankanın yapay zeka gider bütçesini gelecek yıl iki katına çıkarmayı beklediğini açıkladı. Banka, hayata geçirilen yaklaşık 140 kullanım senaryosunun 400 milyon dolarlık maliyete karşılık 800 milyon dolarlık fayda ürettiğini bildirdi. Açıklamalar, finans sektöründe yapay zeka yatırımlarının getirisine ilişkin artan sorgulamalar açısından somut bir örnek sunuyor.", "haber_metni": "Bank of America CEO'su Brian Moynihan, geçen hafta katıldığı bir Barclays konferansında bankanın yapay zeka gider bütçesini gelecek yıl ikiye katlamayı beklediğini söyledi. Moynihan'a göre banka, yaklaşık 140 yapay zeka kullanımını 400 milyon dolar maliyetle hayata geçirdi ve bunlardan 800 milyon dolarlık fayda elde etti. Banka Eş Başkanı Jim DeMare ise en ölçülebilir getirilerin yazılım geliştirme ve kodlama gibi teknoloji birimlerinde görüldüğünü belirtti; bankanın 20 bin yazılım geliştiricisinin kodlama ajanları kullanmasıyla verimlilikte yüzde 15-20 civarında artış sağlandığını aktardı. Yapay zeka destekli sanal asistan Erica'nın kurum içi self servis taleplerini üstlenmesi de yardım masası başvurularında belirgin azalma sağladı. Öte yandan Accenture'ın araştırmasına göre banka yöneticilerinin yalnızca yüzde 20'si yapay zeka girişimlerinden yaygın ve sürdürülebilir değer elde ettiğini bildiriyor.\n\nMoynihan, 3,5 trilyon dolarlık aktif büyüklüğe sahip bankanın çalışan sayısının yıl başındaki yaklaşık 213 binden 209 bine gerilediğini, ancak işten çıkarma yapılmadığını ve yalnızca işe alımların dikkatle yönetildiğini vurguladı. Bankanın Teknoloji ve Bilgi Direktörü Hari Gopalkrishnan, çalışanlardan toplanan fikirlerin değerlendirilmesinde yatırım getirisinin belirleyici olduğunu ve yapay zeka yatırım ilgisinin geçen yıla göre iki kattan fazla arttığını söyledi. Gopalkrishnan, yapay zeka ajanlarına tanınacak özerklik düzeyinin ancak uygun güvenlik önlemleri sağlandıktan sonra genişletileceğini belirtti. Moynihan da yapay zekanın ürettiği bilgilerin insan kontrolünden geçmeden müşterilere sunulmasının başlıca risk olduğunu ve çalışanların kullandıkları yapay zeka çıktılarından sorumlu tutulduğunu ifade etti.", "ozet_durum": "tam"}, {"id": "606cc0a9617e0440", "title": "Türkiye’nin Milli Yapay Zeka Platformu EVREN Erişime Açıldı", "url": "https://shiftdelete.net/turkiyenin-milli-yapay-zeka-platformu-evren-erisime-acildi", "category": "turkiye", "source": "shiftdelete", "site": null, "published": "2026-09-28", "first_seen": "2026-09-28", "relevance": 7, "baslik_tr": "Savunma Sanayii Başkanlığı Öncülüğünde Geliştirilen Yapay Zekâ Platformu EVREN Kullanıma Açıldı", "ozet": "T.C. Cumhurbaşkanlığı Savunma Sanayii Başkanlığı öncülüğünde geliştirilen yerli yapay zekâ platformu EVREN erişime açıldı. Tüm verilerin Türkiye sınırları içindeki GPU altyapısında işlenmesi, veri egemenliği ve teknolojik bağımsızlık açısından platformun temel ayırt edici özelliği olarak öne çıkıyor.", "haber_metni": "T.C. Cumhurbaşkanlığı Savunma Sanayii Başkanlığı öncülüğünde geliştirilen yerli ve millî yapay zekâ platformu EVREN, veri egemenliğini ve teknolojik bağımsızlığı güçlendirme hedefiyle resmen kullanıma açıldı. Savunma sanayiinden teknoloji girişimlerine, akademisyenlerden öğrencilere uzanan geniş bir kitleye hitap eden platform; veri setlerini, gelişmiş modelleri ve yüksek başarımlı GPU altyapısını tek merkezde topluyor. Platform üzerindeki tüm istem, yanıt ve kullanım verileri Türkiye sınırları içindeki GPU altyapısında işleniyor; böylece kritik ve hassas verilerin yurt dışı kaynaklı bulut servislerine aktarılmasının önüne geçiliyor. Kullanıcılar, e-Devlet kimlik doğrulaması ile evren.ssyz.org.tr adresi üzerinden platforma giriş yapabiliyor.\n\nEVREN, abonelik veya doğrudan ücretli modeller yerine katkı esaslı bir kredi mekanizması kullanıyor. Kullanıcılar veri seti yükleyerek, veri etiketleyerek veya eğittikleri modelleri paylaşarak kredi kazanıyor ve bu kredilerle GPU havuzunda model eğitimi ile büyük dil modeli çıkarımları gerçekleştirebiliyor. Platformda 11 açık ağırlıklı büyük dil modelini kapsayan bir çıkarım katmanı ile nesne tespiti, segmentasyon ve sınıflandırma gibi bilgisayarlı görü alanlarında uçtan uca model eğitimi imkânı bulunuyor. 1 Kasım 2026 tarihine kadar yapılacak API çağrıları kredi bakiyesinden düşülmeden sınırsız sunuluyor. Kısa sürede 7 bin 500 aktif kullanıcıyı aşan platformun, Ulusal Yapay Zekâ Eylem Planı hedeflerine katkı sunması; önümüzdeki dönemde yerli büyük dil, görüntü ve ses modellerinin entegre edilmesi ve dağıtık GPU yönetimiyle hesaplama kapasitesinin ölçeklenmesi hedefleniyor.", "ozet_durum": "tam"}, {"id": "6a1fce6897b0a882", "title": "Trusted execution environments for central banks - bis.org", "url": "https://news.google.com/rss/articles/CBMikAFBVV95cUxNZUlaVUlEOXJCRi1NTVA3Z2lEdFFrQ0paXzRqVTVaSXF6TUdPeFE0RTVqUENSUDhwYlNQelF2Q2VwUW5TVDZXT1B4OFA2UHFUV2hFZVR6Y29jTTFfRXM2eURibGFlTVFtcEw4R1AxSTVEVFRraTZaMEZ6VDJsVWhmVjREd0kxWkVOSHVTUHBORS0?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "bis.org", "published": "2026-09-25", "first_seen": "2026-09-28", "relevance": 7, "ozet_durum": "içerik alınamadı"}, {"id": "dc519e9eff677cab", "title": "Old workers, young machines: can AI and automation offset population ageing? - bis.org", "url": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxNZ1FaZUVhY3BjQ2F0eWFnb002ZGVXTFQybUtRWDRTSk5xRjVNMzZ6NGxXNkt1dWpjQkd0eGVEUUpzUFBMLU1rVU9lSUJhRmZHTFA4RXhtOGRLd2dNc0RnNC10aXpwUkJ1R3VoOFNIQlNtdTFucHNmR2hSSThTZDg5RFh0di1wZHZUY29veGJqaTEwdHJoS1l5UVVjR09ZZm9MR2xvUTNBZ3VSazBwMUlmR3pmTE5vS09NRlZN?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "bis.org", "published": "2026-09-24", "first_seen": "2026-09-28", "relevance": 6, "ozet_durum": kez-bankaciligi", "source": "fintechtimes", "site": null, "published": "2026-09-28", "first_seen": "2026-09-28", "relevance": 7, "baslik_tr": "VerityX Labs'ın ilk yarışması BAE bankaları için katır hesap tespiti ve müdahalesine odaklanıyor", "ozet": "Emirates Institute of Finance destekli VerityX Innovation Labs programının ilk yarışması, BAE bankaları için yapay zekâ destekli katır hesap tespiti ve müdahalesi konusuna odaklanıyor. Yarışma, BAE Merkez Bankası'nın (CBUAE) katır hesap tespitini açık bir denetim beklentisi hâline getiren düzenlemesi karşısında bankaların mevcut sistemleri ile düzenleyici gereklilikler arasındaki farkı kapatmayı hedefliyor.", "haber_metni": "Emirates Institute of Finance destekli VerityX Innovation Labs programının ilk yarışması, BAE bankaları için yapay zekâ destekli katır hesap tespiti ve müdahalesi başlığını taşıyor. Program, bankaların inovasyon döngüsünü on iki aydan doksan güne indirmeyi amaçlıyor. Katır hesaplar, BAE'deki tüketici dolandırıcılığı ve kara para aklama şemalarının mutabakat katmanını oluşturuyor; hesaplar KYC doğrulamasından geçtiği ve görünüşte olağan davrandığı için kural tabanlı izleme sistemleri bunları çoğunlukla para gittikten sonra fark ediyor. Yarışma metnine göre BAE'de ikamet edenlerin yarısından fazlası her ay bir finansal dolandırıcılık girişimiyle karşılaştığını bildiriyor. Düzenleyici zemin ise CBUAE'nin CBUAE/FCMCP/2025/3057 sayılı bildirimi: Lisanslı kuruluşlardan katır hesapların erken tespiti, kesintisiz gerçek zamanlı işlem izleme ve işlem bazında risk puanlaması bekleniyor; uyum süresi büyük ölçüde 31 Mart 2026'da doluyor ve ihlal başına 250.000 AED'ye kadar ceza öngörülüyor.\n\nYarışma, tespitin gerçek zamanlı bekletme, reddetme veya ek doğrulama gibi ölçülü müdahalelere dönüşmesini, açıklanabilir uyarılar ve soruşturmacı geri bildirimiyle modelin yeniden eğitilmesini şart koşuyor. Katılımcılar, sentetik ve anonimleştirilmiş BAE temsili veri setleriyle donatılmış VerityX Labs Sandbox ortamında geliştirme yapacak. Değerlendirmede tespit performansı yüzde 30, müdahale yüzde 25, açıklanabilirlik ve denetlenebilirlik yüzde 20, devreye alınabilirlik yüzde 15, uyum ve veri etiği yüzde 10 ağırlık taşıyor. BAE'de yerleşiklik veya lisans zorunlu değil; seçilen çözümler sponsor bir bankayla kontrollü pilota ilerleyecek.", "ozet_durum": "tam"}, {"id": "a6c42e97c08aeaf4", "title": "Sibos 2026 preview: AI, tokenised money and the ledger take the stage", "url": "https://thefintechtimes.com/sibos-2026-preview-ai-tokenised-money-and-the-ledger-take-the-stage/", "category": "merkez-bankaciligi", "source": "fintechtimes", "site": null, "published": "2026-09-27", "first_seen": "2026-09-28", "relevance": 6, "baslik_tr": "Sibos 2026 Miami'de başlıyor: Gündemde yapay zeka, tokenize mevduat ve Swift defteri var", "ozet": "Swift'in yıllık konferansı Sibos 2026, ilk kez Miami'de düzenleniyor ve 1 Ekim'e kadar sürecek. 160'tan fazla ülkeden 10 binin üzerinde katılımcının beklendiği etkinliğin ana gündemini, bankaların yapay zekayı, tokenize mevduatları ve Swift'in blokzincir tabanlı ortak defterini üretim ortamına nasıl taşıyacağı oluşturuyor.", "haber_metni": "Swift'in yıllık konferansı Sibos 2026, pazartesi günü Miami Beach Kongre Merkezi'nde başlıyor ve 1 Ekim Perşembe gününe kadar sürüyor; etkinlik ilk kez Miami'de düzenleniyor. Bu yılın teması 'yapay zeka odaklı ekonomiler için dijital finans' olarak belirlendi. Program; ödemeler, menkul kıymetler ve döviz, ticaret, yapay zeka ve inovasyon, ESG ile dijital varlıklar olmak üzere altı akışta 250'den fazla oturumda 500'ü aşkın konuşmacıyı kapsıyor. Organizatör, 160'tan fazla ülkeden 10 binin üzerinde delege bekliyor. Açılış genel oturumunu Citi Yönetim Kurulu Başkanı ve CEO'su Jane Fraser yapacak; Swift CEO'su Javier Pérez-Tasso ve Başkan Graeme Munro ise kuruluşun Frankfurt'tan bu yana ilerleyen gündemini aktaracak.\n\nHaftanın öne çıkan başlığı, Swift'in geçen yıl Frankfurt'ta duyurulan ve temmuz ayında kullanıma hazır ilan edilen blokzincir tabanlı ortak defteri. Citi, HSBC, BNP Paribas, BNY, Standard Chartered, DBS, FAB ve Wells Fargo'nun aralarında bulunduğu, altı kıtadan 17 banka defter üzerinde tokenize mevduat ödemelerine öncülük ediyor. DBS, OCBC ve UOB bu ay defter üzerinden ilk canlı tokenize Singapur doları ödemelerini tamamladı; IBM ise bankaların mevcut ISO 20022 mesajlarıyla tokenize mevduat talimatı gönderebilmesini sağlayan bir adaptör yayımladı. Programda ayrıca ticarette büyük ölçekli tokenizasyona hazırlık, tek ya da çoklu mutabakat varlığı sorusu ve bir yapay zeka ajanının müşteri adına ödeme başlatmasından önce bankanın neleri denetlemesi gerektiği gibi hesap verebilirlik konuları ele alınacak.", "ozet_durum": "tam"}, {"id": "d5f4868dcc405805", "title": "Consumers want strong independent oversight of banking AI", "url": "https://www.computerweekly.com/news/366651313/Consumers-want-strong-independent-oversight-of-banking-AI", "category": "genel-bt", "source": "computerweekly", "site": null, "published": "2026-09-25", "first_seen": "2026-09-28", "relevance": 6, "ozet_durum": "hata"}, {"id": "47e1dba7e99030d7", "title": "Singapore Financial Stability Risks Rise As AI Investment, Fiscal Pressures Lift Cost Of Capital", "url": "https://www.crowdfundinsider.com/2026/09/313572-singapore-financial-stability-risks-rise-as-ai-investment-fiscal-pressures-lift-cost-of-capital/", "category": "merkez-bankaciligi", "source": "crowdfundinsider", "site": null, "published": "2026-09-28", "first_seen": "2026-09-28", "relevance": 7, "ozet_durum": "hata"}, {"id": "cb6387d1b56976d5", "title": "Philippine Central Bank Sets $16m Capital Requirement For Banks Shifting To Digital Models", "url": "https://www.crowdfundinsider.com/2026/09/313573-philippine-central-bank-sets-16m-capital-requirement-for-banks-shifting-to-digital-models/", "category": "merkez-bankaciligi", "source": "crowdfundinsider", "site": null, "published": "2026-09-28", "first_seen": "2026-09-28", "relevance": 6, "ozet_durum": turmaya yönelik iki taslağı kamuoyu görüşüne sundu. Taslaklar rezerv, sermaye ve risk yönetimi standartları ile ihraç başvurularına ilişkin süreci kapsıyor.", "haber_metni": "ABD Merkez Bankası (Fed) Yönetim Kurulu, 24 Eylül 2026 tarihinde, GENIUS Yasası kapsamında Kurul denetimindeki ödeme amaçlı stablecoin ihraççılarına ilişkin düzenleyici çerçevenin oluşturulmasına yönelik iki taslağı kamuoyu görüşüne açtı. İlk taslak, Kurul denetimindeki ihraççıların stablecoin'lerini kısa vadeli Hazine bonoları ve belirli diğer yüksek kaliteli likit varlıklar gibi izin verilen rezerv varlıklarla tam olarak teminatlandırmasını zorunlu kılıyor. Taslak ayrıca, stablecoin faaliyetlerinden kaynaklanan kredi ve operasyonel risklere karşı standart sermaye yükümlülükleri ile yasaya uygun risk yönetimi standartları getiriyor. Buna ek olarak, stablecoin'leri teminatlandıran varlıkların saklanması hizmetini sunan Kurul denetimindeki kuruluşlara ilişkin kurallar öngörülüyor ve Kurul denetimindeki bankalar için stablecoin ve ilgili faaliyetlerin hangi koşullarda yürütülebileceği açıklığa kavuşturuluyor.\n\nİkinci taslak ise ödeme amaçlı stablecoin ihraç etmek isteyen Kurul denetimindeki bankalar için özel bir başvuru süreci tanımlıyor. Başvuru sahiplerinin, diğer belgelerin yanı sıra bir iş planı ve finansal bilgiler sunması gerekecek. Taslak ayrıca başvurulara ilişkin itiraz, dinleme ve nihai karar süreçlerini düzenleyen bir mekanizma oluşturuyor. Her iki taslak için görüş süresi, metinlerin Federal Register'da yayımlanmasından 60 gün sonra sona erecek. Söz konusu düzenlemeler, stablecoin ihraççılarının merkez bankası denetimi altında faaliyet göstereceği kurumsal çerçevenin somutlaşması bakımından önem taşıyor.", "ozet_durum": "tam"}, {"id": "3c4bc9e8608a7eab", "title": "Nvidia is launching a security platform to stop rogue AI agents from hacking systems", "url": "https://qz.com/nvidia-open-agent-safety-platform-ai-security-092826", "category": "genel-bt", "source": "qz", "site": null, "p -09-21", "first_seen": "2026-09-21", "relevance": 6, "baslik_tr": "OCC, Stablecoin ve Yapay Zeka Odaklı Üç Ulusal Tröst Bankasına Koşullu Onay Verdi", "ozet": "ABD Para Birimi Denetleme Ofisi (OCC), 18 Eylül'de Agora National Trust Bank ve Catena Trust Bank'a koşullu onay verirken Bastion Platforms Trust Company'nin ulusal bankaya dönüşümüne izin verdi. Söz konusu onaylar, stablecoin ihracı ve yapay zeka ajanlarına yönelik finansal altyapı geliştiren kuruluşların federal düzenleme kapsamına girmesi bakımından dikkat çekiyor.", "haber_metni": "ABD Para Birimi Denetleme Ofisi (OCC), 18 Eylül Cuma günü üç yeni ulusal tröst bankasına koşullu onay verdi. Agora National Trust Bank ve Catena Trust Bank onay alırken, Bastion Platforms Trust Company'nin ulusal bankaya dönüşümüne izin verildi. Diğer şirketler adına beyaz etiketli stablecoin ihraç eden ve rezerv ile müşteri cüzdanlarının saklanmasını üstlenen Bastion'ın CEO'su Nassim Eddequiouaq, Wall Street Journal'a yaptığı açıklamada, ABD içinde ve dışında ürün başlatmak isteyen büyük finansal kuruluşlar için artık düzenlemeye tabi bir ortak olabileceklerini belirtti. Eddequiouaq, bankaların kesirli sent maliyetlerle 7/24 işlem yapabilmesine yönelik bir beklenti oluşacağını ifade etti. Catena ise internet sitesine göre, hesaplar, ödemeler, hazine işlevleri ve ajanların parayla neler yapabileceğine ilişkin kontroller dahil olmak üzere, yapay zeka ajanlarına özel finansal altyapı geliştiriyor.\n\nNisan ayında lisans başvurusunda bulunan Agora, AUSD stablecoin'inin yanı sıra küresel işletmeler için mutabakat altyapısı, hazine yönetimi ve itibari para bağlantısı içeren kapsamlı bir finansal işletim sistemi geliştirdiğini açıklamıştı. Agora CEO'su ve kurucu ortağı Nick van Eck, ABD federal lisansı olmadan faaliyet göstermenin dünyanın en önemli finans piyasasında altyapıyı kiralamak anlamına geldiğini yazmıştı. OCC, ağustos ayında önceki 18 ay içinde ulusal tröst bankası başvuruları dahil 40 yeni kuruluş başvurusu aldığını bildirmişti; 2011-2024 arasındaki 14 yılda alınan başvuru sayısı ise 48'di. Bu tablo, federal lisanslara yönelik talebin yeniden canlandığını gösteriyor.", "ozet_durum": "tam"}, {"id": "7d31bec1b78f5af3", "title": "Citi CEO Says Companies Scrambling to Launch AI Cyber Defenses", "url": "https://www.pymnts.com/cybersecurity/2026/citi-ceo-says-companies-scrambling-to-launch-ai-cyber-defenses/", "category": "merkez-bankaciligi", "source": "pymnts", "site": null, "published": "2026-09-20", "first_seen": "2026-09-21", "relevance": 7, "ozet_durum": "hata"}, {"id": "b32363d9d22cc4ef", "title": "China central bank adviser says AI could deepen supply-demand imbalance - Reuters", "url": "https://news.google.com/rss/articles/CBMixAFBVV95cUxPc0tLMmJKRDNNUW1lc0ZmOGhTNF9QZWdLdDBxcktJRzk5VGRBSk9PU2FyaVpMcW5NNFNaakpaNXROczBGTk1GR1pvQzdKdTVZNUJvTG9YbjRPdXFRV190VmNVa3ZQaTY1R2E2X3BTcTJiLWlYMGtrbVBEdXNreWtpWVZfVlBJcjAtZnFHTUN5RjRLZTN1WDZUTXgyX0ZTeFl3bXJZYlU5b1l5N296UHBzZjlLUTFjck5KY1llaWdEWk1yakZm?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "Reuters", "published": "2026-09-19", "first_seen": "2026-09-21", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "5b9bcda1065bdbda", "title": "Supervising banks in an AI-shaped economy | Bank for International Settlements - Bank for International Settlements", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTFB1dGtuSjRYcTlVZ2FyTEFaNVFFOURYUXpUZUxVQS16Nm1NRVFHV0JDZmZIWGMycTJZSnZHSkg1amRkOV8wR2pvZFQwNzBZQTB5cVo0VXMtRnRKWkUwdHlOQUZiakZMeVVYMVdXeDhKTWItbC15VnRmX0ZWdGlVdw?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "Bank for International Settlements", "published": "2026-09-18", "first_seen": "2026-09-21", "relevance": 8, "ozet_durum": "içerik alınamadı"}, {"id": "d99d96257d852ac7", "title": "Hidden by complexity? Measuring stablecoin, crypto and decentralised finance ecosystems - Bank for International Settlements", "url": "https://news.google.com/rss/articles/CBMizwFBVV95c  "category": "genel-bt", "source": "gnews-oncelik1", "site": "National Technology News", "published": "2026-09-21", "first_seen": "2026-09-21", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "403f2281799980a7", "title": "AI hallucination of Chinese nuclear components almost led to US military attack", "url": "https://arstechnica.com/ai/2026/09/report-us-almost-boarded-chinese-ship-over-hallucinated-ai-arms-report/", "category": "yapay-zeka", "source": "arstechnica", "site": null, "published": "2026-09-18", "first_seen": "2026-09-21", "relevance": 6, "baslik_tr": "Yapay Zeka Kaynaklı Hatalı İstihbarat, ABD'yi Çin Gemisine Askeri Müdahalenin Eşiğine Getirdi", "ozet": "CNN'in aktardığına göre ABD, yapay zeka araçlarıyla hazırlanan ve tamamen yanlış çıkan bir istihbarat raporuna dayanarak bir Çin gemisine müdahale etmenin eşiğinden döndü. Raporu üreten sohbet robotunun geminin taşıdığı malzemeyi hatalı tanımladığı ortaya çıktı. Olay, yapay zeka halüsinasyonlarının kritik karar süreçlerinde yaratabileceği riskleri somut biçimde ortaya koyuyor.", "haber_metni": "CNN'in dört kaynağa dayandırdığı habere göre, ABD Özel Harekat Komutanlığı'nda görevli bir analist tarafından sunulan ve yapay zeka araçları yardımıyla hazırlanan bir istihbarat raporu, bir Çin gemisinin Orta Doğu üzerinden nükleer silah programı bileşenleri taşıdığını öne sürdü. ABD ordusu, hava desteğiyle gemiyi durdurup arama yapmaya hazırlanırken, yetkililer raporun hazırlanmasında kullanılan sohbet robotunun geminin taşıdığı malzemeyi yanlış tanımladığını fark etti. Kaynaklardan biri olayı CNN'e aktarırken bu durumun 'neredeyse bir savaş başlattığını' ifade etti. Habere göre analist, geminin manifestosuna ilişkin istihbarat raporlarını analiz etmek için kullandığı sohbet robotu, açık kaynak istihbaratını devlet elindeki gizli sinyal istihbaratıyla birleştirmiş ve bu bilgiler tümüyle yanlış bir istihbarat raporuna dönüşmüştü.\n\nOlay, halüsinasyon üreten yapay zeka sistemlerinin profesyonel raporların güvenilirliğini zedelediği en ciddi örneklerden biri olarak nitelendiriliyor. 'Halüsinasyon' kelimesinin 2023'te Cambridge Sözlüğü tarafından yılın kelimesi seçilmesinden bu yana yazarlar, gazeteciler, akademik araştırmacılar, hâkimler, doktorlar, emniyet birimleri ve kurumsal çağrı merkezleri gibi çok sayıda alanda benzer vakalar yaşandı. Bazı araştırmacılar, büyük dil modellerinde halüsinasyonun tümüyle önlenmesinin mümkün olmayabileceğini belirtiyor. Buna karşın ABD Savunma Bakanlığı, ocak ayında tüm uygun verilerin yapay zeka kullanımına açılmasını öngören bir 'yapay zeka hızlandırma stratejisi' yürürlüğe koymuştu.", "ozet_durum": "tam"}, {"id": "60ffab27d31e0e1c", "title": "UK Lords probe whether regulatory sandboxes deliver public benefit", "url": "https://www.globalgovernmentfinance.com/lords-regulatory-sandboxes-inquiry/", "category": "merkez-bankaciligi", "source": "globalgovfin", "site": null, "published": "2026-09-18", "first_seen": "2026-09-21", "relevance": 7, "ozet_durum": "içerik alınamadı"}, {"id": "710d0b901d0ab061", "title": "North Korean Hackers Posed as Recruiters. They Infected 30,000 Devices Worldwide", "url": "https://yro.slashdot.org/story/26/09/20/2349221/north-korean-hackers-posed-as-recruiters-they-infected-30000-devices-worldwide?utm_source=rss1.0mainlinkanon&utm_medium=feed", "category": "genel-bt", "source": "slashdot", "site": null, "published": null, "first_seen": "2026-09-21", "relevance": 6, "ozet_durum": "hata"}, {"id": "d4d67ec0c0e701cf", "title": "AI chatbots give incorrect financial advice 57% of the time, study shows - IBS Intelligence", "url": "https://news.google.com/rss/articles/CBMirgFBVV95cUxQdTRwd0tGVTh6SXZQWGNBY0hnSkpnNUtlNE9TU2l6YUJoal9tOEM0dkdYOGVLcEIxSm9pSFRyY1dsVG5nSk9ONTZyWEZQY3RMRGZlaUNrU3BHUVpDREs2X1VnLVYtTXZfT29Qc1R1S0VjckhBUnZGZ0t3QzdSTEpPM2ZWOVh1RG1fTzZjWjZEUkFtblJ5ZWFzSkZ4RE5nb0MwLVRMZmtZZ0ZBNjY0cHc?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik3", "site": "IBS Intelligence", "published": nu belirtti.\n\nAçık kaynak yapılan çekirdek, bir Prividium zincirinde rolleri ve erişim haklarını yönetiyor; kimin okuma ve yazma yetkisine sahip olacağına karar veriyor. ZKsync yığınının büyük bölümü zaten açık kaynak olduğundan, kurumlar artık ticari bir anlaşma olmadan kamuya açık koddan izinli bir zincir kurabiliyor. Yönetim konsolu, kullanıcı erişim araçları ve ana bankacılık entegrasyonu dâhil bağlayıcılar ise ücretli ürün olarak Matter Labs'te kalıyor. Prividium, işlem verilerini kurum içinde tutarak gizlilik sağlıyor; dışarıya yalnızca defterin doğru güncellendiğine dair kriptografik bir kanıt çıkıyor ve bu kanıt Ethereum veya uyumlu başka bir zincire kaydediliyor. Deutsche Bank'ın DAMA 2 tokenize fon projesi ve UBS'in dijital altın ürününe yönelik kavram kanıtı çalışması ZKsync kullanmış, Cari Network ise tokenize mevduatlar için Prividium'u benimsemişti.", "ozet_durum": "tam"}, {"id": "bc0b3aec062e629c", "title": "NYDF issues cybersecurity guidance", "url": "https://www.finextra.com/pressarticle/110879/nydf-issues-cybersecurity-guidance?utm_medium=rssfinextra&utm_source=finextrafeed", "category": "merkez-bankaciligi", "source": "finextra", "site": null, "published": "2026-09-10", "first_seen": "2026-09-14", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "1479f54c6498fba4", "title": "AI boom poses new financial stability risks, BIS head says - Reuters", "url": "https://news.google.com/rss/articles/CBMirwFBVV95cUxNcDUzRnJ3dHpQaFN0aF9CVHRZbTExQ1h4UHg2OEFaQmxHeHZsdUwtN2piZzdPdk5oYUticEdmSEIyS0RYUlpKYUpRX3ptWFp6WGFNbGp2QXlVNjRIVFdvanlTWXdubklpcXZzUHNWQWxURlBrU3hpcTU0dVJ2M1NEUEpRU3FhUzhHa25XRklRbUo2LUVoVWlsV3dVcVY5SENFc29hd3JXRUZQZG1FbHEw?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "Reuters", "published": "2026-09-10", "first_seen": "2026-09-14", "relevance": 9, "ozet_durum": "içerik alınamadı"}, {"id": "164fb191983789d7", "title": "Artificial intelligence, growth and financial stability: challenges for central banks ttps://thefintechtimes.com/finrege-publishes-fca-cryptoasset-readiness-framework-for-2026/", "category": "merkez-bankaciligi", "source": "fintechtimes", "site": null, "published": "2026-09-13", "first_seen": "2026-09-14", "relevance": 7, "ozet_durum": "hata"}, {"id": "fb54c0084f98f4a3", "title": "Infleqtion and Cisco link quantum computers into early networks", "url": "https://quantumzeitgeist.com/quantum-computer-networks-infleqtion-cisco/", "category": "kuantum", "source": "quantumzeitgeist", "site": null, "published": "2026-09-13", "first_seen": "2026-09-14", "relevance": 6, "baslik_tr": "Infleqtion ve Cisco, kuantum bilgisayarları ağa bağlamak için iş birliğine gitti", "ozet": "Infleqtion ve Cisco, 10 Eylül 2026'da nötr atom tabanlı kuantum bilgisayar ve sensörleri Cisco'nun ağ altyapısıyla birleştirerek dağıtık kuantum mimarisi geliştirmek üzere iş birliği duyurdu. Ortaklık, izole kuantum makineleri yerine birbirine bağlı sistemlere odaklanan sektör eğiliminin bir göstergesi olarak öne çıkıyor.", "haber_metni": "Infleqtion ve Cisco, 10 Eylül 2026'da Infleqtion'ın nötr atom tabanlı kuantum bilgisayarları ile sensörlerini Cisco'nun ağ altyapısına bağlayarak ölçeklenebilir, dağıtık kuantum hesaplama mimarisi geliştirmeyi amaçlayan bir iş birliği duyurdu. Nötr atom kübitlerinin, kuantum ağları için gerekli fotonlarla doğal biçimde etkileşime girmesi, sistemlerin birbirine bağlanmasını kolaylaştıran temel unsur olarak öne çıkıyor. Cisco Araştırma Başkanı Ramana Kompella, kuantum alanındaki bir sonraki büyük atılımın daha büyük izole makineler inşa etmekten değil, sistemleri birbirine bağlamaktan geleceğini belirtti. İş birliği kapsamında Cisco'nun, bağlı cihazlar arasında kuantum dolanıklığını dinamik olarak dağıtmak üzere geliştirdiği kuantum ağ yığını ve kuantum bilgisini koruyarak yönlendiren Universal Quantum Switch araştırma prototipi kullanılacak.\n\nTaraflar, Infleqtion'ın nötr atom kuantum belleği ve kuantum işlem birimlerindeki kuantum durumlarının uzun mesafeli iletim için optik kanallara dönüştürülmesini (optik transdüksiyon) araştıracak; sensörler ile hesaplama düğümleri arasında veri aktarımını düzenleyen mimarileri inceleyecek. Bu yaklaşımın malzeme bilimi ve finansal modelleme gibi alanlarda yeni uygulamalara kapı açabileceği belirtiliyor. Aralık 2025 itibarıyla yüzde 99,73 kapı doğruluğu gösteren 1.600 kübitlik kafes yapısı, deneyler için temel oluşturacak. ABD Savunma Bakanlığı ve NASA gibi kurumlarla çalışan, NYSE'de INFQ koduyla işlem gören Infleqtion, bugüne kadar 550 milyon doların üzerinde fon sağladı; ABD Ticaret Bakanlığı CHIPS Ar-Ge Ofisi ile geliştirme ilerlemesine bağlı 100 milyon dolarlık bağlayıcı olmayan bir niyet mektubu da bulunuyor.", "ozet_durum": "tam"}, {"id": "089b2c1edd2303d1", "title": "Revolut confirms customer data breach after fake government requests - FStech", "url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxNV0xJWlhHRzNZdmtFWDVNMHZuazNfUnQ3TDFZalZPb1cyVG5HamZJd0hSY2s0S0twN1lVb1cwQl9qMTZwSzBxTTd1LUhMWkU5dXFENl9VRk4wMG1OSlRudzUzOTRncXUyaXFiemtFbjNSZUVWTy1pVTBtYWI4dDAwTVBFcktsc0t3VklTbHJYajJkMHdhcEtOTEhubzUxbVQ4UDln?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik2", "site": "FStech", "published": "2026-09-14", "first_seen": "2026-09-14", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "151265a386cbd724", "title": "Russia launches CBDC as digital ruble goes live for everyday use across country", "url": "https://www.globalgovernmentfinance.com/russia-launches-digital-ruble/", "category": "merkez-bankaciligi", "source": "globalgovfin", "site": null, "published": "2026-09-09", "first_seen": "2026-09-14", "relevance": 7, "ozet_durum": "içerik alınamadı"}, {"id": "7ecb0037455c62a4", "title": "Monetary Authority of Singapore reveals latest fintech funding programme", "url": "https://www.globalgovernmentfinance.com/singapore-monetary-authority-fsti-4-funding/", "category": "merkez-bankaciligi", "source": "globalgovfin", "site": null, "published": "2026-09 as aracısı olarak görev aldı. Uluslararası Ödemeler Bankası (BIS) İnovasyon Merkezi ve Uluslararası Finans Enstitüsü tarafından yürütülen kamu-özel iş birliği niteliğindeki proje, toptan merkez bankası rezervleri ile ticari banka mevduatlarının ortak ve programlanabilir bir defterde token olarak kaydedilmesini öngörüyor. Bu tasarım, bir işlemin ilgili bacaklarının ya birlikte tamamlandığı ya da hiç gerçekleşmediği atomik mutabakatı mümkün kılmayı amaçlıyor. TD, testi tokenize paranın platformda ihraç edilip iki iç birim arasında anında taşınabildiğinin kanıtı olarak nitelendirdi.\n\nİşlem, Temmuz 2026 tarihli daha geniş bir gerçek değerli test programının parçası. Asya, Avrupa ve Kuzey Amerika'dan 28 finansal kuruluş ve merkez bankası, altı para biriminde toplam yaklaşık 800 bin İsviçre frangı tutarında işlem gerçekleştirdi. Program; kurumsal ödemeler, bankalar arası transferler ve ödeme karşılığı ödeme mutabakatı dahil 17 senaryoyu kapsadı. BIS'e göre, prototip mevcut gerçek zamanlı brüt mutabakat sistemlerine bağlanmamasına rağmen ödeme başlatmadan mutabakata ortalama süre yaklaşık 80 saniye oldu. Canlı testlere İngiltere Merkez Bankası, Fransa Merkez Bankası, Japonya Merkez Bankası, Kore Merkez Bankası ve İsviçre Ulusal Bankası katıldı; projeye Kanada Merkez Bankası ve New York Fed dahil sekiz merkez bankası katılıyor. Girişim deneysel nitelikte olup organizatörler bir üretim ağı taahhüdünde bulunmadı.", "ozet_durum": "tam"}, {"id": "fc4e386aa5bae645", "title": "Post-quantum cryptography needs collective action, G7 finds", "url": "https://quantumzeitgeist.com/g7-cybersecurity-post-quantum-cryptography-needs/", "category": "kuantum", "source": "quantumzeitgeist", "site": null, "published": "2026-09-06", "first_seen": "2026-09-07", "relevance": 8, "baslik_tr": "G7 Siber Güvenlik Çalışma Grubu kuantum sonrası kriptografiye geçiş için ortak eylem çağrısı yaptı", "ozet": "G7 Siber Güvenlik Çalışma Grubu, kuantum bilişimin dijital güvenliğe yönelik tehdidini uzak bir olasılık olmaktan çıkarıp acil bir risk olarak yeniden değerlendirdi. Grup, kuantum sonrası kriptografiye (PQC) geçişin kurumların tek başına çözebileceği bir sorun olmadığını, kamu ve özel sektör arasında eşgüdümlü planlama gerektiren kolektif bir dönüşüm olduğunu vurguluyor.", "haber_metni": "G7 Siber Güvenlik Çalışma Grubu, kuantum bilişim alanındaki son gelişmelerin ardından kuantum sonrası kriptografiye (PQC) geçişin artık ertelenemez bir zorunluluk hâline geldiğini açıkladı. Grup, mevcut açık anahtarlı kriptografiyi kırabilecek güçteki kriptografik açıdan anlamlı kuantum bilgisayarların (CRQC) varlığının teyit edilmesini beklemenin sistemleri kabul edilemez bir süre boyunca savunmasız bırakacağını belirtiyor. Bu kapsamda kurumların önce en kritik veriyi barındıran sistemleri belirlemesi, kriptografik varlıklarını kapsamlı biçimde değerlendirmesi, bağımlılıkları haritalaması ve aşamalı, risk temelli bir geçiş planı geliştirmesi öneriliyor. Grup, PQC geçişi için beş öncelikli alan tanımlıyor ve geçişin ulusal siber güvenlik otoritelerinin belirlediği takvimler içinde tamamlanmasını hedefliyor.\n\nRapor, saldırganların şifreli verileri bugünden toplayıp gelecekte çözmesine dayanan \"şimdi depola, sonra çöz\" taktiğine özellikle dikkat çekiyor. Bu risk, CRQC'ler ortaya çıkmadan önce dahi kamu verileri, hassas kişisel bilgiler ve uzun süreli gizlilik gerektiren ticari sırlar açısından geçerli. Grup, kimlik doğrulama mekanizmalarının ele geçirilmesinin ağlar içinde hızlı yatay hareketi mümkün kılarak birden fazla kurum ve sektörü etkileyebileceği uyarısında bulunuyor. Geçişin gecikmesinin kuantum kaynaklı risklerin yanı sıra rekabet avantajı kaybına ve kamu alımları dâhil gelecekteki sözleşme süreçlerinden dışlanmaya yol açabileceği ifade ediliyor. Yaygın uygulamanın önündeki başlıca engel olarak farkındalık eksikliği gösteriliyor; bu nedenle teknik rehberlik, yetkinlik geliştirme çalışmaları ve ulusal stratejilerle bütünleşik bir yaklaşım öneriliyor.", "ozet_durum": "tam"}, {"id": "1c1b586020b77023", "title": "Japan’s NEC halts quantum build, cites investment concerns", "url": "https://quantumzeitgeist.com/japans-nec-investment-quantum-halts-roi/", "category": "kuantum", "source": "quantumzeitgeist", "site": null, "published": "2026-09-06", "first_seen": "2026-09-07", "relevance": 6, "baslik_tr": "NEC, yatırım getirisi endişesiyle kuantum bilgisayar geliştirme çalışmalarını durdurdu", "ozet": "Japon teknoloji şirketi NEC, yatırım getirisinin çok uzun süreceği değerlendirmesiyle çalışan bir kuantum bilgisayar geliştirme faaliyetlerini 5 Eylül 2026'da sonlandırdığını açıkladı. 1990'lardan bu yana kuantum bilişim araştırmaları yürüten şirketin bu kararı, temel kuantum araştırmalarının ticari ürüne dönüştürülmesindeki güçlükleri ve özel sektör kuantum girişimlerini etkileyen zaman çizelgesi baskısını ortaya koyuyor.", "haber_metni": "NEC, çalışan bir kuantum bilgisayar geliştirme çalışmalarını durdurduğunu 5 Eylül 2026'da duyurdu. Şirket, geliştirme sürecinin yatırım getirisi sağlamak için çok uzun süreceği sonucuna vardığını belirtti. 1990'lardan bu yana kuantum bilişim araştırmaları yürüten NEC, 1999'da süperiletken katı hal cihazıyla kübit işlemini dünyada ilk gösteren şirket olmuş, 2014'te süperiletken parametron devresiyle yüksek hassasiyetli kübit okuması gerçekleştirmişti. Şirket, NEC-AIST Kuantum Teknolojisi Ortak Araştırma Laboratuvarı üzerinden hem kapı tabanlı kuantum bilgisayarlar hem de kuantum tavlama yaklaşımlarını sürdürüyor, ayrıca Japonya'nın 2050'ye kadar hata toleranslı kuantum bilgisayar hedefleyen Moonshot programında süperiletken devre çalışmasının proje yöneticiliğini üstleniyordu.\n\nŞirketin süperiletken parametron ve Josephson Parametrik Osilatör devrelerine dayalı kuantum tavlama mimarisi, geleneksel tavlayıcılara göre daha uzun eşevrelilik süreleri sunuyordu; ancak sistem 8 kübitlik laboratuvar aşamasının ötesine geçemedi. Kübit sayısıyla ölçeklenen kablolama ve ölçüm donanımı ile seyreltme soğutucularının sınırlı kapasitesi başlıca engeller olarak öne çıkıyordu. Karar, Japonya'nın yapay zeka ve kuantum araştırmaları alanında uzmanlık kazandırmak amacıyla 30 bin genç bilim insanını yurt dışına gönderme planını açıkladığı bir döneme denk geldi ve ABD ile Çin'in kuantum bilişime yönelik kapsamlı yatırımlarıyla tezat oluşturuyor. Gelişme, köklü teknoloji şirketleri için dahi kuantum araştırmalarını ticari ürüne dönüştürmenin güçlüğünü gösteriyor.", "ozet_durum": "tam"}, {"id": "8dd0a666c1415f41", "title": "How will EU's AI Act impact banks? - ATM Marketplace", "url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE5OSHI5OGRrSzhtbnBkUnRmYkxzNExDV0IyMVdpalZpMHZlOWFUbHdwc0V3emxpc2NHVjdwNHcxVl9zR0hlSDM1QmFvLWJ4TGdnMW00cnBocWJJQzYwR1FiMkp2LW5xU2hudEdkdVkydjBjMnRXc20wX0Fn?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik3", "site": "ATM Marketplace", "published": "2026-09-02", "first_seen": "2026-09-07", "relevance": 7, "ozet_durum": "içerik alınamadı"}, {"id": "f275dd9c9dd77fd3", "title": "GCC central banks step up cybersecurity, fintech co-operation - Zawya", "url": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxPRmdueXdlLUNORi1UVzROdktSTEYzNmJfSUN6Z0ZIcFJOZUNnbVNPNDZCVjEzTVI4Vk9Rcl9BUWZlSHdXemJBQXBDTDcxcHdGLVdtekxGbzBZOE02NmxLaW5OUF84ZHFELUZ3WW9qMnh4M1ktWkhOUW50WEtLNkhYUmxiakpucjlBelN6S0h6ODZmbHR5eWFzMFQ3NnNzZzFMVXI1MldmNTl6MjYzbndEVGcxa1FQM19pYnFLZDJ4Vzg?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik3", "site": "Zawya", "published": "2026-09-07", "first_seen": "2026-09-07", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "e0a360ccd6d84e9f", "title": "OpenAI agent breach strains IP rules built around human conduct - MLex", "url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxPcTRQMEtTcVRVclY5cHc0bVlLTjdrbDZkYXF0UlNxeVNTamo5SEFrRUVWczNVMzMxTG1TcmJ0X0V6eVFIbnFvb2FCeFMyaHd3X1d4Yl9WWlB0OTRiRjktZnNMVk54d0MyTXF1cXMzZldyaWJVM0ppb0VXLUpPSlVFbkpRWWJlaXM1RmtkSjJnelJJNVlDR1d6RmI3bXBWT0NNVWlOUVNMckdHNzBWUFJuMmViYmNINDBn 8", "first_seen": "2026-08-31", "relevance": 6, "baslik_tr": "İngiltere Merkez Bankası sistemik stablecoin'lerde bireysel tutma limitini kaldırdı, likidite desteği açıkladı", "ozet": "İngiltere Merkez Bankası (BoE), 22 Haziran'da sterlin cinsinden sistemik stablecoin'lere ilişkin politika bildirimi ve taslak Uygulama Kuralları'nı yayımladı. Bireysel ve kurumsal tutma limitleri yerine ürün başına geçici 40 milyar sterlinlik ihraç tavanı getirildi; ayrıca ihraççılara yönelik bir merkez bankası likidite imkânı kurulacağı doğrulandı. Bu adımlar, kamu ve özel para arasındaki sınırın yeniden çizilmesi açısından merkez bankaları için önem taşıyor.", "haber_metni": "İngiltere Merkez Bankası (BoE), 22 Haziran'da sterlin cinsinden sistemik stablecoin'lere ilişkin politika bildirimini ve taslak Uygulama Kuralları'nı yayımladı. Daha önce bireyler için 20.000 sterlin, işletmeler için 10 milyon sterlin olarak önerilen tutma limitleri, sektörden gelen itirazların ardından tamamen kaldırıldı. Bunun yerine, stablecoin ürünü başına geçici 40 milyar sterlinlik ihraç tavanı getirildi; tavan düzenli olarak gözden geçirilecek ve bankaların kredi arzına yönelik riskler azaldığında kaldırılması hedefleniyor. Bu yaklaşım, dijital euro için yaklaşık 3.000 euroluk bireysel limit öngören Avrupa Birliği'nin tercihinden yapısal olarak ayrışıyor: Kişi bazlı limit yerine ürün bazlı tavan, aynı politika hedefini (bankalardan düzensiz mevduat çıkışlarının sınırlanması) farklı bir mekanizmayla koruyor.\n\nPara politikası açısından dikkat çeken bir diğer unsur, BoE'nin sistemik stablecoin ihraççıları için devlet tahvili teminatı karşılığında kısa vadeli kredi sağlayacak bir likidite imkânı kuracağını doğrulaması oldu. Banka bu imkânı bir son çare desteği olarak tanımlıyor; birebir karşılık zorunluluğunun yerini almayacak ve ödeme gücünü yitirmiş kuruluşlara çözüm sunmayacak. Tasarım ayrıntıları 2027'de açıklanacak. Ödül mekanizmaları konusunda ise BoE, işlem bazlı ödülleri (iade, indirim, sadakat programları) serbest bırakırken, tutma süresine bağlı getirileri yasaklıyor. Taslak Uygulama Kuralları'na ilişkin görüşler 22 Eylül'e kadar alınacak. BoE, bu adımların arka kapıdan bir dijital sterlin başlatma kararı anlamına gelmediğini açıkça belirtti.", "ozet_durum": "tam"}, {"id": "c9fd7485c9bc0d05", "title": "What makes or breaks the digital euro", "url": "https://www.omfif.org/2026/08/what-makes-or-breaks-the-digital-euro/", "category": "merkez-bankaciligi", "source": "omfif", "site": null, "published": "2026-08-24", "first_seen": "2026-08-31", "relevance": 7, "baslik_tr": "Model çalışması: Dijital euronun benimsenmesini kullanım kolaylığı belirleyecek", "ozet": "OMFIF ve Imperial College London Finansal Teknoloji Merkezi'nden bir araştırmacı, dijital euronun benimsenmesini etkileyecek tasarım kararlarını ajan tabanlı bir modelle inceledi. Çalışma, kayıt süresinin 20 dakikayı aşmaması ve kişiden kişiye ödemelerin 60 saniye veya altında tamamlanması gerektiğine işaret ediyor. Bulgular, Avrupa Merkez Bankası'nın ürün tasarımı tercihlerinin projenin başarısı açısından belirleyici olduğunu gösteriyor.", "haber_metni": "OMFIF, Imperial College London Finansal Teknoloji Merkezi'nden bir araştırmacıyla birlikte, üç tasarım kararının dijital euronun benimsenmesini nasıl etkileyebileceğini inceleyen ajan tabanlı bir model geliştirdi. İsveç'in Swish ödeme uygulaması ve Riksbank'ın benimseme modellemesini temel alan çalışmaya göre, kayıt sürecindeki sürtünme benimsemenin önündeki temel engellerden biri; bu nedenle kayıt işleminin 20 dakikayı aşmaması gerekiyor. Model ayrıca kişiden kişiye (P2P) ödemelerin hızının kritik olduğunu gösteriyor: Telefon rehberinden alıcı seçilerek yapılan Swish benzeri bir transfer yaklaşık 30 saniye sürerken, QR kodu gerektiren işlemler 60 saniyeyi, geleneksel bankacılık uygulamasından hesap bilgisi kopyalamayı gerektiren işlemler ise iki dakikayı buluyor. Çalışma, P2P ödemelerin perakende kanalına kıyasla benimseme açısından daha verimli bir alan olduğuna işaret ediyor.\n\nAvrupa Merkez Bankası'nın bazı alanlarda doğru yolda olduğu değerlendiriliyor. Banka, tutma limitleri nedeniyle cüzdanların manuel olarak doldurulması zorunluluğunu ortadan kaldıran şelale/ters şelale fonlama mekanizmasını ve dijital euronun fiziksel kartla kullanılmasını sağlayan ortak markalama (co-badging) özelliğini hayata geçirme niyetini açıkladı. Ortak markalama sayesinde mağaza içi ödemeler yaklaşık 12 saniyede tamamlanabilecek; bu süre Swish ile yapılan 56 saniyelik mağaza içi ödemelere kıyasla avantajlı görünüyor. Çalışmaya göre, ECB gerçekçi kullanım hedefleri belirleyip bunlara ulaşamazsa maliyetlerine yönelik incelemelerle karşılaşabilir; güvenli ve teknik açıdan güçlü bir dijital euro, kullanımı zahmetli olduğu takdirde yeterli olmayacak.", "ozet_durum": "tam"}, {"id": "11f1bdc046877159", "title": "China’s digital renminbi is running on two tracks", "url": "https://www.omfif.org/2026/08/chinas-digital-renminbi-is-running-on-two-tracks/", "category": "merkez-bankaciligi", "source": "omfif", "site": null, "published": "2026-08-21", "first_seen": "2026-08-31", "relevance": 6, "ozet_durum": "hata"}, {"id": "9db9f57643d8c69a", "title": "UK government to give Bank of England new payments innovation mandate", "url": "https://www.globalgovernmentfinance.com/bank-of-england-secondary-objective-payments-innovation/", "category": "merkez-bankaciligi", "source": "globalgovfin", "site": null, "published": "2026-08-27", "first_seen": "2026-08-31", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "2a330bca2f2022e1", "title": "Yapay Zeka Düzenlemesi İçin Yarış Kızışıyor - Haber Aktüel", "url": "https://news.google.com/rss/articles/CBMihgFBVV95cUxQSFgwM3hCQWJRRXRGNGktUE91X0JjRGxDaUtJWkQtM25CX0RURXQ3djRjb0xMcnZmOUtNNjZPTHJpcHMwSE1hVGN0Y1JJTzZvOXlVQzJTYTRnUzhjQjgwYXRwNWo4MFhPUlZhQkY3dnNVUVhlTDZkalNDcXBWajc1V3IxQ01CZw?oc=5", "category": "ai-governance", "source": "gnews-kesif-tr", "site": "Haber Aktüel", "published": "2026-08-30", "f : "gnews-kesif-en", "site": "Insurance Business", "published": "2026-08-31", "first_seen": "2026-08-31", "relevance": 8, "ozet_durum": "içerik alınamadı"}, {"id": "1e5752fb2c17d7b0", "title": "Global banks sign for Ant International AI forecasting model", "url": "https://www.finextra.com/newsarticle/48280/global-banks-sign-for-ant-international-ai-forecasting-model?utm_medium=rssfinextra&utm_source=finextrafeed", "category": "merkez-bankaciligi", "source": "finextra", "site": null, "published": "2026-08-21", "first_seen": "2026-08-24", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "d53c0d5d4e7ab087", "title": "OpenAI Exec Tells People to Expect Routine AI-Driven Cyberattacks", "url": "https://www.pymnts.com/news/artificial-intelligence/2026/openai-exec-tells-people-to-expect-routine-ai-driven-cyberattacks/", "category": "merkez-bankaciligi", "source": "pymnts", "site": null, "published": "2026-08-23", "first_seen": "2026-08-24", "relevance": 7, "ozet_durum": "hata"}, {"id": "e7f2c00f05e6268a", "title": "Crypto4A QASM Module Achieves FIPS 140-3 Level 3 Validation", "url": "https://thequantuminsider.com/2026/08/21/crypto4a-fips-140-3-level-3-quantum-safe-hsm/", "category": "kuantum", "source": "quantuminsider", "site": null, "published": "2026-08-21", "first_seen": "2026-08-24", "relevance": 6, "baslik_tr": "Crypto4A'nın QASM kriptografik modülü FIPS 140-3 Seviye 3 doğrulaması aldı", "ozet": "Kanadalı siber güvenlik şirketi Crypto4A, QASM kriptografik modülü için FIPS 140-3 Seviye 3 doğrulaması elde etti. Şirket, NIST onaylı tüm kuantum sonrası kriptografi algoritmalarını destekleyen bir donanım güvenlik modülünde bu doğrulama seviyesine ulaşan ilk şirket olduğunu açıkladı. Doğrulama, kuantum sonrası kriptografiye geçiş hazırlığındaki kurumlar için bağımsız güvence sağlıyor.", "haber_metni": "Kanadalı siber güvenlik şirketi Crypto4A Technologies, QASM kriptografik modülü için FIPS 140-3 Seviye 3 doğrulaması aldı. Şirket, NIST onaylı tüm kuantum sonrası kriptografi (PQC) algoritmalarını destekleyen bir donanım güvenlik modülünde (HSM) bu doğrulama seviyesine ulaşan dünyadaki ilk şirket olduğunu duyurdu. Donanım güvenlik modülleri; bankacılık işlemleri, dijital kimlikler, kamu iletişimi, savunma sistemleri ve kritik altyapının güvenliğini sağlayan kriptografik anahtarları koruyor. FIPS 140-3, kriptografik teknolojilerin değerlendirilmesinde kullanılan en katı standartlardan biri olarak kabul ediliyor; Seviye 3 ise fiziksel müdahaleye karşı güçlü koruma, kimlik tabanlı sıkı doğrulama ve kriptografik anahtarların güvenli yönetimini şart koşuyor.\n\nDoğrulama, kuantum sonrası kriptografiye geçiş hazırlığı yapan hükümetler ve kurumlar açısından, Crypto4A teknolojisinin yüksek güvenlik gereksinimlerini karşıladığına ve kuantum dönemi için tasarlanan yeni kriptografik standartları desteklediğine dair bağımsız güvence sunuyor. DigiCert CEO'su Amit Sinha, dijital ekonomide güvenin bağımsız olarak doğrulanmış kriptografik temellere dayandığını ve bu sertifikasyon seviyesinin kurumlara doğrulanabilir güvenlik konusunda güven verdiğini belirtti. Crypto4A CEO'su ve kurucu ortağı Bruno Couillard ise kuantum bilişimin hızla ilerlediğini, ekonomilerin ve ulusal güvenliğin dayandığı sistemlerin hazır olması gerektiğini ifade ederek doğrulamayı Kanada siber güvenlik inovasyonu için önemli bir kilometre taşı olarak nitelendirdi. Kanada'da tasarlanan ve geliştirilen teknoloji, kurumlara kriptografiyi bugünden yönetebilecekleri güvenli bir altyapı sağlarken, değişen güvenlik gereksinimlerine göre geçiş esnekliği de sunuyor.", "ozet_durum": "tam"}, {"id": "2a9923cb57cb5507", "title": "Frontier AI labs still won’t say how they’d contain a rogue model", "url": "https://techcrunch.com/2026/08/22/frontier-ai-labs-still-wont-say-how-theyd-contain-a-rogue-model/", "category": "yapay-zeka", "source": "techcrunch-ai", "site": null, "published": "2026-08-22", "first_seen": "2026-08-24", "relevance": 6, "ozet_durum": "hata"}, {"id": "9536602a03800e0 ri, yapay zekâyı finansal suçla mücadele operasyonlarının bir parçası hâline getiriyor. Sistemler tarama, soruşturma, uyarı yönetimi, müşteri durum tespiti ve vaka anlatılarının hazırlanması gibi süreçlerde kullanılıyor. Artan işlem hacimleri, sıkılaşan düzenleyici beklentiler, hızlı ödemeler ve yaptırım karmaşıklığı karşısında yapay zekâ; bilgiyi düzenleme, vaka materyalini özetleme, eksik alanları belirleme, işleri önceliklendirme ve anlatı taslakları hazırlama gibi görevlerde el emeğini azaltabiliyor. Özellikle kurumsal yapılar, sınır ötesi risk, nihai faydalanıcı ve servet kaynağı gereksinimlerinin bulunduğu müşteri kabul süreçlerinde otomasyonun yükü hafiflettiği belirtiliyor. Ancak metne göre asıl soru, yapay zekânın bu işleri yapıp yapamayacağı değil, çıktı üretildiğinde hesap verebilirliğin kimde olduğu.\n\nEn büyük risk, kararların bilinçli olarak makineye devredilmesi değil; sistemin bir çıktı ürettiği, analistin bunu kabul ettiği ve gerçek bir değerlendirme yapılıp yapılmadığının belirsiz kaldığı bir gri alanın oluşması olarak tanımlanıyor. Akıcı bir metnin doğruluk anlamına gelmediği, iyi yazılmış bir gerekçenin her zaman iyi kanıtlanmış olmadığı vurgulanıyor. Bu nedenle şirketlerin, kural tabanlı mantık, yapay zekâ ve insan yargısından hangisinin sürecin hangi bölümünde kullanıldığını net biçimde tanımlaması gerekiyor. Yapay zekâ bir uyarının kapatılmasına katkı sağladığında, vaka dosyasında hangi bilginin incelendiği, sistemin ne kattığı, analistin neyi kontrol ettiği ve nihai kararı kimin onayladığı açıkça belgelenmeli. Aksi hâlde verimlilik artarken kontrolün zayıflayabileceği ifade ediliyor.", "ozet_durum": "tam"}, {"id": "5562f3a1ba06ec93", "title": "NCSC tells organisations to have AI kill switches at the ready", "url": "https://www.computerweekly.com/news/366649464/NCSC-tells-organisations-to-have-AI-kill-switches-at-the-ready", "category": "genel-bt", "source": "computerweekly", "site": null, "published": "2026-08-21", "first_seen": "2026-08-24", "relevance": 7, "ozet_durum": "hata"}, {"id": "783f677ec18ccd3c", "title": "Asia-Pacific Central Banks Step Up Cooperation on AI, Scam Prevention", "url": "https://www.crowdfundinsider.com/2026/08/300552-asia-pacific-central-banks-step-up-cooperation-on-ai-scam-prevention/", "category": "merkez-bankaciligi", "source": "crowdfundinsider", "site": null, "published": "2026-08-23", "first_seen": "2026-08-24", "relevance": 7, "ozet_durum": "hata"}, {"id": "a501edab612ef1f9", "title": "Protocol balances accuracy and privacy in quantum sensing networks", "url": "https://quantumzeitgeist.com/technical-denmark-protocol-balances-accuracy-privacy/", "category": "kuantum", "source": "quantumzeitgeist", "site": null, "published": "2026-08-23", "first_seen": "2026-08-24", "relevance": 6, "baslik_tr": "Kuantum sensör ağlarında doğruluk ile gizlilik dengesini sağlayan yeni protokol geliştirildi", "ozet": "Danimarka Teknik Üniversitesi ve Sorbonne Üniversitesi araştırmacıları, dağıtık kuantum sensör ağlarının bireysel düğüm verilerini açığa çıkarmadan ortalama bir faz parametresini tahmin etmesine olanak tanıyan bir protokol geliştirdi. Protokol, toplam foton sayısıyla artan hassasiyet (Heisenberg ölçeklemesi) sunarken, tahmin doğruluğu ile gizlilik arasındaki ödünleşimleri de nicel olarak ortaya koyuyor.", "haber_metni": "Danimarka Teknik Üniversitesi ve Sorbonne Üniversitesi araştırmacıları, dağıtık kuantum algılama için ortalama bir fazı toplam foton sayısıyla artan hassasiyetle tahmin eden ve Heisenberg ölçeklemesi sergileyen bir protokol geliştirdi. Protokolde her düğüm, paylaşılan dolanık bir Gauss durumuna yerel bir faz kodluyor; bu yapı, bireysel düğüm verileri açığa çıkmadan küresel parametrenin tahmin edilmesine imkân veriyor. Ekibin kuantum Fisher bilgi matrisi (QFIm) üzerinden yürüttüğü analiz, iki modlu ve çok modlu senaryolar arasında kritik bir ayrım ortaya koyuyor: İki modlu sıkıştırılmış durum tam gizliliği korurken, bir tarafın kendi fazını bilmesi durumunda diğer tarafın fazı tahmin edilen ortalamadan çıkarılabildiği için gizlilik ihlal edilmiş sayılıyor.\n\nÇok taraflı düzeneklerde sonlu sıkıştırma altında tam gizliliğe ulaşılamıyor; ancak sıkıştırma arttıkça QFIm özdeğerlerinin baskın olanı daha hızlı büyüyerek matrisi asimptotik olarak birinci dereceye yaklaştırıyor ve erişilebilir bilgi ortalama fazla sınırlanıyor. Böylece tam gizlilik, büyük sıkıştırma limitinde ortaya çıkıyor. Araştırmacılar ayrıca yer değiştirmelerin ve optik kayıpların etkisini inceleyerek tahmin doğruluğu ile gizlilik arasındaki ödünleşimleri belgeledi ve protokolü diğer sürekli değişkenli kaynak durumlarıyla kıyaslayarak rekabetçi performans gösterdiğini ortaya koydu. Çalışma, düğüm gizliliğini korurken iş birliğiyle parametre tahmini yapabilen kuantum sensör ağlarının inşası için nicel bir çerçeve sunuyor; hassas metroloji ve güvenli iletişim gibi alanlarda potansiyel uygulamalara işaret ediyor.", "ozet_durum": "tam"}, {"id": "1954bb9342a24dca", "title": "HSBC, Standard Chartered complete first live tokenised deposit transaction on Swift - FinTech Futures", "url": "https://news.google.com/rss/articles/CBMixAFBVV95cUxOazgzZERwVVVwNlhoUTFvNkJYX1BGNndNWkhyTFpjU3NwcVlGd3lVQlJPTmtkU0hTV1NqT09sbE13VWYyV055RzZ4RFVPWldzZmZVUjlFME1NZDEwYWFGMi1vZld4cWRabW9zWWFYY2VJejFDZ2ZGSTIwcmxMTVN0dUhXNVZlVi11TFJJQ3hya1ZFUFlCR0VSRkI4dlp3RDhTbVJJM0YwekFjUVZadk5ReXRVOTNjZFJyTkc2aWZKcGg0b21O?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik2", "site": "FinTech Futures", "published": "2026-08-19", "first_seen": "2026-08-24", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "3f8e81f2819b0659", "title": "NZ plans overhaul of “operationally reliable but outdated” retail payments system", "url": "https://www.globalgovernmentfinance.com/modernising-new-zealand-retail-payment-system-consultation/", "category": "merkez-bankaciligi", "source": "globalgovfin", "site": null, "published": "2026-08-21", "first_seen": "2026-08-24", "relevance": 6, "ozet_durum": aai1qUmNfUlJ1QVFBdTltNGYwSzVxajRKQ1pMb2NOTXh4QzR0V2tLbnVpVEZm?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "mas.gov.sg", "published": "2026-09-30", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "e8553c33ea260437", "title": "AI governance gap emerges as GCC’s biggest cyber security challenge", "url": "https://www.computerweekly.com/news/366651550/AI-governance-gap-emerges-as-GCCs-biggest-cyber-security-challenge", "category": "genel-bt", "source": "computerweekly", "site": null, "published": "2026-10-05", "first_seen": "2026-10-05", "relevance": 6, "baslik_tr": "Körfez ülkelerinde yapay zeka yönetişim açığı en büyük siber güvenlik riski olarak öne çıkıyor", "ozet": "Cybergate Bilgi Güvenliği Direktörü (CISO) Srdjan Babic, Körfez İşbirliği Konseyi (GCC) ülkelerinde yapay zeka kullanımının yönetişim yapılarından daha hızlı yaygınlaştığını ve bu açığın fidye yazılımı veya tedarik zinciri saldırılarından daha büyük bir risk oluşturduğunu belirtti. Babic, kurumların eğitim katılımı yerine ölçülebilir yetkinliğe odaklanması ve yönetim kurullarının kanıta dayalı denetim sorması gerektiğini vurguluyor.", "haber_metni": "Cybergate CISO'su Srdjan Babic, Körfez İşbirliği Konseyi (GCC) ülkelerinde yapay zeka kullanımının yaygınlaşma hızının, bu teknolojiyi yönetmek için gereken yönetişim, gözetim ve iş gücü kapasitelerinin gelişiminin önüne geçtiği uyarısında bulundu. Babic'e göre kurumların bugün karşılaştığı en önemli siber güvenlik riski fidye yazılımı, tedarik zinciri saldırıları veya gelişmiş zararlı yazılımlar değil; yapay zeka kullanımı ile yönetişim yapıları arasındaki giderek açılan farktır. Babic, belge taslağı hazırlama gibi dar ve düşük riskli bir görev için onaylanan üretken yapay zeka araçlarının birkaç ay içinde, kimsenin karar vermediği bir şekilde, aday değerlendirme veya sözleşme özetleme gibi alanlara yayıldığını ve kişisel verilerin komutlara girildiğini belirterek bu durumu \"gölge yapay zeka\" olarak tanımlıyor.\n\nBabic, yenilik ile güvenlik arasında bir denge kurulması gerektiği varsayımına karşı çıkarak, yönetişim olmadan yapılan yeniliğin ertelenmiş bir maliyet olduğunu savunuyor. Yapay zekanın siber güvenlikteki asıl değerinin tekrarlayan operasyonel işleri otomatikleştirerek insan muhakemesini kritik kararlara yönlendirmek olduğunu, ancak yönetişim çalışması yapılmadan devreye alınan savunma araçlarının saldırı yüzeyinin yönetilmeyen yeni bir parçası haline gelebileceğini ifade ediyor. Beceri açığı konusunda ise kurumların katılımı değil yetkinliği ölçmesi gerektiğini, bir tamamlama sertifikasının yalnızca katılımı kanıtladığını vurguluyor. Babic'e göre yönetim kurullarının teknik ayrıntılara değil, risk yönetiminin kanıtlarla gösterilip gösterilemediğine ve kritik yapay zeka sistemlerini kimin denetlediğine odaklanması gerekiyor.", "ozet_durum": "tam"}, {"id": "b0404c1f8264d8a5", "title": "LHV Bank rolls out agentic AI for customer emails with Gradient Labs - FinTech Futures", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxNUWRyaEl6a0xYM2pjT2JHOFY4NG9VWG1RdlZYRDlJblJwX0Y2VW1WQ0JVNTRHV0VVV0tiZDZISEdqdVZWMHdLeEhBZ0tzOTJYd2xCNkdLTW5OOU1Ed0hOcnF1M281RHkwTTZsMlpUa2pFd2E1eklzcldXV1VuWWpCM2tzcktHTkowWXNSWGdFVUZlZGw0TG1YQy1xZld2Z0EteEY4Zw?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik2", "site": "FinTech Futures", "published": "2026-09-28", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "7673443d6e34d13d", "title": "Labour market policies in the age of AI - CEPR", "url": "https://news.google.com/rss/articles/CBMia0FVX3lxTE85WFJCSDI4MlJndXdtUmF3WGFfLWUyekRCTVFNN1RRX1F5akc1UmJmRUlnVlJaM05JZnZFMUF2cjkxckJNakh0dm8xY0V2NjhRRTdvZG9HMnZ3RkxsVmhTU1N1V3JtVTN4blBz?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik2", "site": "CEPR", "published": "2026-09-28", "first_seen": "2026-10-05", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "261b5320f675a8aa", "title": "
