I Model", "url": "https://www.pymnts.com/opinion/2026/smarter-security-takes-more-than-a-bigger-ai-model/", "category": "merkez-bankaciligi", "source": "pymnts", "site": null, "published": "2026-11-09", "first_seen": "2026-11-09", "relevance": 6, "ozet_durum": "hata"}, {"id": "5a062781ed69b14e", "title": "Malaysia Considers Faster Transition to Quantum-Resistant Security", "url": "https://thequantuminsider.com/2026/11/09/malaysia-quantum-resistant-security-transition/", "category": "kuantum", "source": "quantuminsider", "site": null, "published": "2026-11-09", "first_seen": "2026-11-09", "relevance": 7, "baslik_tr": "Malezya, Kuantuma Dirençli Güvenliğe Geçişi Hızlandırmayı Değerlendiriyor", "ozet": "Malezya, ulusal verileri gelecekteki kuantum bilişim tehditlerinden korumak amacıyla kuantuma dirençli güvenlik sistemlerine geçişi hızlandırmayı değerlendiriyor. İletişim Bakanı Fahmi Fadzil, Malezya İletişim ve Multimedya Komisyonuna ulusal güvenlik kurumları ve telekom şirketleriyle ortak bir Ar-Ge girişimini görüşme talimatı verdi. Girişim, kuantuma dirençli şifreleme ve kuantum-güvenli iletişimin ülke genelinde daha hızlı ve güvenli biçimde benimsenmesini hedefliyor.", "haber_metni": "Malezya, ulusal veri korumasını güçlendirmek amacıyla kuantuma dirençli güvenliğe geçişini hızlandırmayı değerlendiriyor. Free Malaysia Today'in aktardığına göre İletişim Bakanı Fahmi Fadzil, Malezya İletişim ve Multimedya Komisyonuna (MCMC) Ulusal Güvenlik Konseyi (MKN), Ulusal Siber Güvenlik Ajansı (Nacsa) ve telekomünikasyon şirketleriyle olası bir iş birliğini görüşme talimatı verdi. Fahmi, bu iş birliğinin ülkede kuantum geçişini daha hızlı ve güvenli hale getirmeyi amaçlayan bir araştırma ve geliştirme alanı kurmayı hedeflediğini belirtti. Kuantum geçişi, mevcut dijital güvenlik sistemlerinin, gelecekteki kuantum bilgisayarların oluşturabileceği tehditlere karşı veri koruması sağlayan kuantuma dirençli şifreleme teknolojilerine yükseltilmesi süreci olarak tanımlanıyor.\n\nBakan Fahmi, açıklamalarını Mobile World Congress (MWC) Doha 2026 kapsamında çeşitli sergi stantlarını ziyaret ettikten sonra yaptı. Dikkatini çeken yenilikler arasında kuantum-güvenli iletişimi sayan Fahmi, bu teknolojinin verilerin gelecekte korunması açısından giderek önem kazandığını söyledi. Kuantum bilgisayarların piyasaya çıkmasının, hâlen veri güvenliği için kullanılan kriptografi ve şifreleme yöntemlerini zorlayacağını öngördüğünü belirten bakan, kuantum geçişi ile kuantum-güvenli iletişimin önümüzdeki yıllarda birçok ülkenin gündemindeki temel konular arasında yer alacağını ifade etti. Fahmi, fuar ziyaretinde ayrıca yapay zekânın akıllı şehir hizmetleri ve güvenlik sistemleriyle entegrasyonu gibi diğer yenilikleri de inceleme fırsatı bulduğunu aktardı.", "ozet_durum": "tam"}, {"id": "67fad4fc21bf1f4a", "title": "Finance firms lean into multiagent systems, model routing", "url": "https://www.ciodive.com/news/finance-firms-lean-multiagent-systems-model-routing/873809/", "category": "genel-bt", "source": "ciodive", "site": null, "published": "2026-11-05", "first_seen": "2026-11-09", "relevance": 6, "baslik_tr": "Finans kuruluşları çoklu ajan sistemlerine yönelirken yatırım getirisini kanıtlamakta zorlanıyor", "ozet": "Capgemini Research Institute'un 1.100 üst düzey yöneticiyle yaptığı ankete göre, temel bankacılık ve sigortacılık iş akışlarında çoklu ajan sistemleri geliştiren finansal kuruluşların yaklaşık yarısı yatırım getirisini tutarlı biçimde gösteremiyor. Ajan tabanlı yapay zekâ kuruluşların yüzde 60'ında pilot veya üretim aşamasında olsa da, ajanları ortamlar genelinde özerk çalıştırabilen kuruluş oranı yalnızca onda bir düzeyinde.", "haber_metni": "Capgemini Research Institute'un finans sektöründen 1.100 üst düzey yöneticiyle gerçekleştirdiği ankete göre, temel bankacılık ve sigortacılık iş akışlarında çoklu ajan sistemleri geliştiren kuruluşların yaklaşık yarısı yatırımlarının getirisini tutarlı şekilde ortaya koyamıyor. Ankete katılan finansal kuruluşların yüzde 60'a yakını ajan tabanlı yapay zekâ sistemlerini pilot veya üretim aşamasında kullanırken, ajanları kurum ortamları genelinde özerk biçimde orkestre edebilen kuruluş oranı yalnızca yüzde 10. Capgemini finansal hizmetler küresel bulut başkanı Ravi Khokhar, başarılı çoklu ajan sistemlerinin, ajanların veri erişimini, karar alma süreçlerini ve eylemlerini yöneten yerleşik bir bulut altyapısı gerektirdiğini; ölçeklenme sürecinde en güçlü temele sahip kuruluşların gerçek değeri göreceğini belirtiyor.\n\nRapora göre ankete katılan kuruluşların neredeyse tamamı, token maliyetlerini kontrol altında tutmak için sorguları uygun kalitede çıktı verebilen en maliyet etkin modele yönlendiren otomatik model yönlendirmeyi kullanıyor veya kullanmayı planlıyor. Bank of America, sorguları küçük bir sınıflandırıcı modelle en uygun maliyetli modele yönlendiren Orchestra adlı katmanı devreye aldı; Travelers Insurance ise sorguları öncü modellere göre daha düşük maliyetle işlemek üzere kendi büyük dil modeli TravelersLLM'i geliştirdi. Ankete göre üç yıl içinde kuruluşların üçte ikisinden fazlasında bulut ve ajan tabanlı yapay zekâ için hibrit yaklaşım baskın hale gelecek. Capgemini ayrıca, yapay zekâ harcamalarının gerekçesinde operasyonel verimlilikten iş sonuçlarına kayış öngörüyor; iş sonuçlarını öne çıkaran yönetici sayısının 2028'e kadar yüzde 141 artması bekleniyor.", "ozet_durum": "tam"}, {"id": "fccd10706cd54b22", "title": "French bank Credit Mutuel Arkea says €100 million missing after cyberattack - Reuters", "url": "https://news.google.com/rss/articles/CBMixgFBVV95cUxObnU2SlpvVWVvS09oNFhpM25OcnhQeDhHLVF5SC1HSjZSY2dUMVZ1eFlyX1J6OGxyQVctbVRGRnF6X2luaFhnZVlaTmRnaTl3MXd2YnVONS1fbFZhQ2xBUFZmR3JETFQwTWh6cjF1Ty0yMjFlTjRDN2QwVzFFekhPZTMwY19la3QxdldNUUhFbFVoRjNtOXdFSTNlMzBHRU1JRnlaWUxUY01RVHUyeTUtYjZDSDhPUjFlOXcwV3B5Nkkzakh0c1E?oc=5", "category": "merkez-bankaciligi", "source": "gnews-oncelik1", "site": "Reuters", "published": "2026-11-05", "first_seen": "2026-11-09", "relevance gnews-oncelik2", "site": "FStech", "published": "2026-11-05", "first_seen": "2026-11-09", "relevance": 6, "ozet_durum": "içerik alınamadı"}, {"id": "2b67f3a896e7631a", "title": "European Stability Mechanism issues €1bn digital-native bond via Eurosystem’s Pontes", "url": "https://www.globalgovernmentfinance.com/european-stability-mechanism-digital-native-bond-pontes/", "category": "merkez-bankaciligi", "source": "globalgovfin", "site": null, "published": "2026-11-03", "first_seen": "2026-11-09", "relevance": 6, "baslik_tr": "Avrupa İstikrar Mekanizması, Eurosystem'in Pontes altyapısıyla 1 milyar euroluk dijital tahvil ihraç etti", "ozet": "Avrupa İstikrar Mekanizması (ESM), Eurosystem'in Pontes girişimi üzerinden 1 milyar euro tutarında dijital-doğuşlu (digital-native) tahvil ihracı gerçekleştirdi. Haberin kaynak sayfasına teknik bir erişim sorunu nedeniyle ulaşılamadığından, işlemin ayrıntılarına ilişkin ek bilgi edinilememiştir.", "haber_metni": "Avrupa İstikrar Mekanizması (ESM), Eurosystem bünyesindeki Pontes altyapısını kullanarak 1 milyar euro tutarında dijital-doğuşlu tahvil ihraç etti. İhraç, geleneksel yöntemlerle basılıp sonradan dijital ortama aktarılan menkul kıymetlerden farklı olarak, doğrudan dijital ortamda oluşturulan bir borçlanma aracı niteliği taşıyor. İşlemin Eurosystem'in Pontes girişimi aracılığıyla gerçekleştirilmiş olması, euro bölgesindeki kamu kurumlarının merkez bankası altyapılarını dijital menkul kıymet ihraçlarında kullanmaya başladığını gösteren bir örnek oluşturuyor.\n\nÖte yandan, haberin yayımlandığı kaynak sayfaya hazırlık sırasında teknik bir bağlantı sorunu nedeniyle erişilemediğinden, ihracın vadesi, kupon yapısı, kullanılan teknolojinin ayrıntıları ve işleme katılan diğer taraflar hakkında doğrulanmış bilgi edinilememiştir. Bu nedenle söz konusu gelişmeye ilişkin değerlendirme, yalnızca duyurulan başlık düzeyindeki bilgiyle sınırlıdır. Kaynak erişilebilir hale geldiğinde işlemin kapsamı, Pontes altyapısının rolü ve mutabakat sürecine ilişkin ayrıntıların ayrıca incelenmesi uygun olacaktır. Konu, merkez bankası parası ile dijital varlık mutabakatı alanındaki Eurosystem çalışmaları açısından izlenmeye değer görülmektedir.", "ozet_durum": "tam"}, {"id": "c90e01df6fc05ebc", "title": "CISA Flags SonicWall SonicOS MFA Bypass Flaw Amid Reports of Possible Exploitation", "url": "https://thehackernews.com/2026/11/cisa-flags-sonicwall-sonicos-mfa-bypass.html", "category": "siber-guvenlik", "source": "thehackernews", "site": null, "published": "2026-11-09", "first_seen": "2026-11-09", "relevance": 6, "ozet_durum": "hata"}, {"id": "bbd6bc72b2226285", "title": "Hackers Target OpenSSH SSHole Flaw Within Hours of Disclosure, Gain Root on Honeypot", "url": "https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html", "category": "siber-guvenlik", "source": "thehackernews", "site": null, "published": "2026-11-06", "first_seen": "2026-11-09", "relevance": 9, "ozet_durum": "hata"}, {"id": "84cbf85cae46b191", "title": "Hackers pull off $133 million French bank heist via service provider", "url": "https://www.bleepingcomputer.com/news/security/hackers-pull-off-133-million-french-bank-heist-via-service-provider/", "category": "siber-guvenlik", "source": "bleepingcomputer", "site": null, "published": "2026-11-07", "first_seen": "2026-11-09", "relevance": 7, "ozet_durum": "hata"}, {"id": "05e86b0c1fe8e505", "title": "Runaway AI hacking agent behind WorkOS breach after escaping sandbox", "url": "https://www.bleepingcomputer.com/news/security/runaway-ai-hacking-agent-behind-workos-breach-after-escaping-sandbox/", "category": "siber-guvenlik", "source": "bleepingcomputer", "site": null, "published": "2026-11-06", "first_seen": "2026-11-09", "relevance": 8, "ozet_durum": "hata"}, {"id": "0acb5f1bc8e7864a", "title": "OpenAI's new GPT-6 Cyber AI finds 81 Firefox flaws, 948 Linux bugs", "url": "https://www.bleepingcomputer.com/news/security/openais-new-gpt-6-cyber-ai-finds-81-firefox-flaws-948-linux- onları kontrol ettikleri banka hesaplarına büyük ödemeler göndermeye ikna ettiği öne sürülüyor. ABD Savcısı Jamie McDonald, sanıkların yapay zekayı gerçek kişileri taklit etmek ve kurumsal yöneticileri kandırmak için kullanarak yaklaşık 129 milyon dolar elde ettiğini belirtti. Soall ve Hazan bu yaz İspanya'da, Sheetrit ise eylül ayında Birleşik Krallık'ta yakalandı; üçü için de iade talepleri beklemede. Sanıklar kara para aklama, ağırlaştırılmış kimlik hırsızlığı ve elektronik dolandırıcılık dahil çok sayıda suçlamadan 104 yıla kadar hapisle karşı karşıya.\n\nSavcılara göre 2024-2026 yılları arasında yürütülen plan kapsamında sanıklar, görüşmelerde gerçek yöneticilerin ses ve görüntülerini yapay zekayla taklit etti; çalışanlara gizli bir finansal işlem için yardım gerektiğini söyleyip, işlemi yürüttüğü iddia edilen uluslararası bir hukuk firmasının avukatlarıyla görüşmeye yönlendirdi ve bu avukatları da yapay zekayla canlandırdı. Mağdurlar arasında Missouri ve Kaliforniya'daki hastaneler, Rhode Island'da bir banka, Massachusetts'te bir finans şirketi ve Birleşik Krallık'ta bir teknoloji firması bulunuyor. Paralar ABD, Avrupa, BAE ve Çin'deki hesaplara aktarıldıktan sonra kripto paraya çevrildi. FBI yetkilisi James Barnacle, suçluların yapay zeka gibi gelişen teknolojileri silah haline getirmeye devam ettiğini vurguladı; FBI, mağdur olabilecek diğer şirketleri başvurmaya çağırdı.", "ozet_durum": "tam"}, {"id": "6827e1a95839cf90", "title": "CISA flags WordPress RCE flaw as actively exploited in attacks - BleepingComputer", "url": "https://news.google.com/rss/articles/CBMirwFBVV95cUxPSUg0UEx0Zm5ZTU1NcEQ4X01IZEljX2tiNGdnQ1k4czFHd21Lc3hEX0VFdVR3azJuaG40bWtLd0tnM0psVDk1bVFOYkdTZHJsdFlkckhZVWc0ZFM5UnBwRmhYbmRqM2xOUWQ0S1NhS3lYaWxyMURQN3BCNnJXZFkyNUVnMDNJY1gzMGs4UkJ2akhnWDBYazlsSVpvcnJBU2JWb0JaQVhzaUxSa2ZPQTN30gG0AUFVX3lxTE5RVHNFUzMyc3FWUWRsVTQtNnFHTzBPZ05yU2RiamRZZFdsVGdPSEFKUi1ZMW95Z25sZlE4SDRaQ1p4b00yUFdQeXd3c1VtWHV6YUhocVN6bjFneG9vX3ZXWkpmcFFKM2RkYUpfa1B0OEhDeVRZLVhJRWl4 const LABELS={"yapay-zeka": "Yapay Zeka", "siber-guvenlik": "Siber Güvenlik", "kuantum": "Kuantum", "veri-merkezi": "Veri Merkezi", "ai-governance": "AI Governance", "merkez-bankaciligi": "Merkez Bankacılığı / Ödeme Sistemleri", "is-surekliligi": "İş Sürekliliği", "turkiye": "Türkiye", "genel-bt": "Genel BT"};
const ANAHTAR="haber-radar-kapali";
let cat="hepsi", tarih="hepsi";
let kapali=new Set();
try{kapali=new Set(JSON.parse(localStorage.getItem(ANAHTAR)||"[]"))}catch(e){}
function kaydet(){try{localStorage.setItem(ANAHTAR,JSON.stringify([...kapali]))}catch(e){}}
const TARIHLER=[...new Set(ITEMS.map(i=>i.first_seen||""))].sort().reverse();
function chip(txt,on,fn,n){const b=document.createElement("button");b.className="chip"+(on?" on":"");
  b.innerHTML=txt+(n!=null?`<span class="n">${n}</span>`:"");b.onclick=fn;return b}
function render(){
  const f=document.getElementById("filters");f.innerHTML='<span class="lbl">Konu</span>';
  ["hepsi",...new Set(ITEMS.map(i=>i.category))].forEach(c=>
    f.appendChild(chip(c==="hepsi"?"Tümü":(LABELS[c]||c),cat===c,()=>{cat=c;render()})));
  const t=document.getElementById("tarihler");t.innerHTML='<span class="lbl">Tarih</span>';
  const say=d=>ITEMS.filter(i=>(cat==="hepsi"||i.category===cat)&&i.first_seen===d).length;
  t.appendChild(chip("Tüm tarihler",tarih==="hepsi",()=>{tarih="hepsi";render()}));
  TARIHLER.forEach(d=>t.appendChild(chip(d,tarih===d,()=>{tarih=d;render()},say(d))));
  const herbiri=TARIHLER.slice(1);
  const hepsiKapali=herbiri.length&&herbiri.every(d=>kapali.has(d));
  const btn=document.createElement("button");btn.className="act";
  btn.textContent=hepsiKapali?"Hepsini aç":"Eskileri kapat";
  btn.onclick=()=>{if(hepsiKapali)kapali.clear();else{kapali=new Set(herbiri)}kaydet();render()};
  if(herbiri.length&&tarih==="hepsi")t.appendChild(btn);

  let items=ITEMS.filter(i=>(cat==="hepsi"||i.category===cat)&&(tarih==="hepsi"||i.first_seen===tarih));
  items=[...items].sort((a,b)=>(b.first_seen||"").localeCompare(a.first_seen||"")||(b.relevance||0)-(a.relevance||0));
  const list=document.getElementById("list");list.innerHTML="";
  if(!items.length){list.innerHTML='<p class="empty">Bu seçimde haber yok.</p>';return}
  let cur=null,sec=null;
  items.forEach(i=>{
    if(i.first_seen!==cur){cur=i.first_seen;const d=cur;
      sec=document.createElement("section");sec.className="day"+(kapali.has(d)&&tarih==="hepsi"?" kapali":"");
      const h=document.createElement("h2");
      h.innerHTML=`<span><span class="ok">▾</span> ${d} taraması</span><span>${items.filter(x=>x.first_seen===d).length} haber</span>`;
      h.onclick=()=>{kapali.has(d)?kapali.delete(d):kapali.add(d);kaydet();render()};
      sec.appendChild(h);list.appendChild(sec);}
    const a=document.createElement("article");a.className="item";
    const rel=i.relevance!=null?`<span class="rel">önem ${i.relevance}/10</span>`:"";
    a.innerHTML=`<h3><a href="${i.url}" target="_blank" rel="noopener">${i.title}</a></h3>
      <div class="meta"><span>${LABELS[i.category]||i.category}</span><span>${i.site||i.source}</span>${rel}</div>`;
    sec.appendChild(a);});
}
render();
</script></body></html>
