# ── BLOK 1: HTML kaynaklar (generic HTML fetcher bölümüne) ────
- id: techmeme-events
  ad: "Techmeme Events"
  url: "https://www.techmeme.com/events"
  secici: "a"              # her etkinlik tek <a> satırı: "Tarih + Ad + Şehir"
  not: >
    Küresel küratörlü liste. Türkiye filtresi YOK ve gerekmiyor:
    TR dışı yüz yüze etkinlikleri mevcut yuz_yuze_ulkeler kuralı
    zaten eler; VIRTUAL/HYBRID etiketli satırlar ile istisna_kurumlar
    (BIS/IMF/ECB...) eşleşmeleri kalır. Seçiciyi ilk Actions
    logundan doğrula.

- id: suerf-events
  ad: "SUERF Etkinlikler"
  url: "https://www.suerf.org/events/"
  secici: "a"              # ilk çalıştırmada logdan doğrula
  not: "Merkez bankacılığı webinar/konferansları; çoğu ücretsiz, online"

- id: omfif-meetings
  ad: "OMFIF Meetings (DMI dahil)"
  url: "https://www.omfif.org/meetings/"
  secici: "a"              # ilk çalıştırmada logdan doğrula
  not: "CBDC/ödemeler sanal panelleri; TCMB'nin zaten katıldığı ağ"

